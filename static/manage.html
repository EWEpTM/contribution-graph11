<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="Keep 事件类型配置">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Keep">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>事件配置</title>
    <script src="/theme.js"></script>
    <script src="/common.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --danger: #da3633;
            --accent: #58a6ff;
            --overlay: rgba(0,0,0,0.8);
        }
        html[data-theme="light"] {
            --bg: #ffffff;
            --bg2: #f6f8fa;
            --bg3: #eaeef2;
            --text: #1f2328;
            --muted: #656d76;
            --border: #d0d7de;
            --green: #1a7f37;
            --danger: #cf222e;
            --accent: #0969da;
            --overlay: rgba(31,35,40,0.45);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100%;
            min-height: 100dvh;
            padding: max(12px, env(safe-area-inset-top)) clamp(12px, 3vw, 24px) max(12px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(0.75rem, 2vw, 1.25rem);
            flex-shrink: 0;
            gap: 8px;
        }
        h1 { font-size: clamp(1.1rem, 2.5vw, 1.4rem); color: var(--text); }
        .edit-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2.5vw, 18px);
            border-radius: 8px;
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            cursor: pointer;
        }
        .edit-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(140px, 100%), 1fr));
            gap: clamp(10px, 2vw, 16px);
            flex: 1;
            align-content: start;
            min-height: 0;
        }
        @media (min-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        .btn {
            border: none;
            border-radius: 16px;
            padding: clamp(16px, 3vw, 28px) clamp(10px, 2vw, 16px);
            font-size: clamp(0.9rem, 1.8vw, 1.05rem);
            font-weight: 600;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-height: clamp(100px, 18vw, 140px);
            position: relative;
            touch-action: manipulation;
        }
        .btn.dragging { opacity: 0.55; }
        .btn.drag-over { outline: 2px dashed #fff; outline-offset: -4px; }
        .btn .drag-hint {
            position: absolute; top: 6px; left: 8px;
            font-size: 0.7rem; opacity: 0.7; display: none;
        }
        body.editing .btn .drag-hint { display: block; }
        body.editing .btn { cursor: grab; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn .emoji { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1; }
        .btn .name {
            max-width: 100%;
            padding: 0 4px;
            text-align: center;
            line-height: 1.25;
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: normal;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: clamp(0.8rem, 1.6vw, 0.95rem);
        }
        .btn .low-tag {
            position: absolute; top: 8px; right: 8px;
            font-size: 0.65rem; background: rgba(0,0,0,0.35);
            padding: 2px 6px; border-radius: 8px; font-weight: 500;
        }
        .add-btn { background: var(--bg3); border: 2px dashed var(--border); color: var(--muted); cursor: pointer; }
        .modal {
            display: none; position: fixed; inset: 0; background: var(--overlay);
            z-index: 200; align-items: center; justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
            backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
            padding: clamp(16px, 3vw, 22px); width: 100%; max-width: min(400px, 94vw);
            max-height: min(90dvh, 90vh); overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal h2 { font-size: clamp(1rem, 2.2vw, 1.15rem); margin-bottom: 16px; color: var(--text); }
        .modal input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text); font-size: 1rem; margin-bottom: 14px;
        }
        .modal input[type="text"]:focus { outline: none; border-color: var(--green); }
        .modal label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
        .hint { font-size: 0.75rem; color: var(--muted); margin: -8px 0 14px; }
        .custom-emoji-row { margin-bottom: 14px; }
        .custom-emoji-row input[type="text"] { margin-bottom: 0; text-align: center; font-size: 1.5rem; }
        .color-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
        .color-option { width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .color-option.selected { border-color: #fff; }
        .custom-color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .custom-color-row input[type="color"] {
            width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); cursor: pointer; padding: 2px; flex-shrink: 0;
        }
        .custom-color-row input[type="text"] {
            flex: 1; margin-bottom: 0; font-family: ui-monospace, monospace;
            text-transform: uppercase; min-width: 0;
        }
        .checkbox-row {
            display: flex; align-items: center; gap: 10px; background: var(--bg);
            border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px;
            margin-bottom: 16px; cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; }
        .checkbox-row label { margin-bottom: 0; color: var(--text); font-size: 0.9rem; cursor: pointer; user-select: none; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 4px; }
        .modal-buttons button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn-cancel { background: var(--bg3); color: var(--muted); }
        .btn-save { background: var(--green); color: #fff; }
        .btn-delete {
            width: 100%; margin-top: 16px; padding: 12px;
            border: 1px solid var(--danger); border-radius: 8px;
            background: transparent; color: var(--danger); font-size: 0.95rem; font-weight: 600; cursor: pointer;
        }
        .btn-danger-confirm { background: var(--danger); color: #fff; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .footer { text-align: center; margin-top: clamp(0.75rem, 2vw, 1.25rem); padding: 8px 0; flex-shrink: 0; }
        .footer a { color: var(--accent); text-decoration: none; font-size: clamp(0.85rem, 1.5vw, 0.95rem); }
        #toast {
            visibility: hidden; opacity: 0; background: var(--green); color: #fff;
            padding: 10px 24px; border-radius: 30px; position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); z-index: 3000; font-size: 0.9rem; font-weight: 600;
            transition: opacity 0.25s, visibility 0.25s; pointer-events: none;
        }
        #toast.show { visibility: visible; opacity: 1; }
        #toast.error { background: var(--danger); }
    </style>
</head>
<body>
    <div class="header">
        <h1>事件配置</h1>
        <div style="display:flex;gap:8px;">
            <button class="edit-btn" id="syncBtn" onclick="initData()" title="刷新">↻</button>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()">编辑</button>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer"><a href="/">← 返回主页</a></div>
    <div id="toast"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">添加事件类型</h2>
            <label>名称（最多 16 字）</label>
            <input type="text" id="eventName" placeholder="例如：跑步" maxlength="16" autocomplete="off">
            <div class="hint">显示名称限制 16 个字，过长会自动截断</div>
            <label>图标 (输入或粘贴 Emoji)</label>
            <div class="custom-emoji-row">
                <input type="text" id="customEmojiInput" placeholder="输入 Emoji，如 ☕" oninput="onCustomEmojiInputChange(this.value)">
            </div>
            <label>颜色 (预设 / HEX自选)</label>
            <div class="color-picker" id="colorPicker"></div>
            <div class="custom-color-row">
                <input type="color" id="hexColorPicker" oninput="onCustomColorPickerChange(this.value)">
                <input type="text" id="hexColorInput" placeholder="#238636" maxlength="7" oninput="onCustomHexInputChange(this.value)">
            </div>
            <div class="checkbox-row" onclick="document.getElementById('isLowFreq').click()">
                <input type="checkbox" id="isLowFreq" onclick="event.stopPropagation()">
                <label for="isLowFreq">低频事件（1次记录即达到高亮）</label>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" id="saveBtn" onclick="saveEvent()">添加</button>
            </div>
            <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="openDeleteConfirmModal()">彻底删除此事件类型</button>
        </div>
    </div>

    <div class="modal" id="deleteModal">
        <div class="modal-content" style="max-width:320px;">
            <h2 style="color:var(--danger);">确认彻底删除</h2>
            <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px;line-height:1.5;">
                确定要彻底删除「<strong id="deleteTargetName" style="color:var(--text);"></strong>」吗？<br>
                <span style="color:var(--danger);font-size:0.8rem;">⚠️ 将同步清空该事件的所有历史记录！</span>
            </p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDeleteConfirmModal()">取消</button>
                <button class="btn-danger-confirm" onclick="executeDelete()">确认删除</button>
            </div>
        </div>
    </div>

<script>
const colors = [
    '#8B4513','#238636','#f97316','#eab308',
    '#3b82f6','#a855f7','#ec4899','#ef4444',
    '#14b8a6','#6366f1','#84cc16','#f59e0b'
];
let eventsList = [];
let isEditing = false;
let selectedEmoji = '📱';
let selectedColor = colors[0];
let editingIndex = -1;
let dragFrom = -1;

// escapeHtml 由公共文件 static/common.js 提供

async function initData() {
    const btn = document.getElementById('syncBtn');
    if (btn) btn.style.animation = 'spin 1s linear infinite';
    try {
        const res = await fetch('/api/sources');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            const data = await res.json();
            eventsList = Array.isArray(data) ? data : [];
        }
    } catch (e) {
        eventsList = [];
    } finally {
        if (btn) btn.style.animation = 'none';
        render();
    }
}

function generateUniqueSourceId() {
    return 'src_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
}

// 仅允许 #RRGGBB 样式色，堵住 style 属性注入（服务端已校验，这里做纵深防御）
function safeStyleColor(color) {
    if (typeof color === 'string' && /^#[0-9a-fA-F]{6}$/.test(color)) return color;
    return '#8b949e';
}

function render() {
    document.body.classList.toggle('editing', isEditing);
    const grid = document.getElementById('grid');
    grid.innerHTML = eventsList.map((e, i) => `
        <button type="button" class="btn" data-index="${i}"
            style="background:linear-gradient(135deg,${safeStyleColor(e.color || '#8b949e')},${safeStyleColor(adjustColor(e.color || '#8b949e',-20))})"
            ${isEditing ? `draggable="true" ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${i})" ondragend="onDragEnd(event)"` : `onclick="openEdit(${i})"`}
            ${isEditing ? `onclick="if(!window.__didDrag)openEdit(${i})"` : ''}>
            ${isEditing ? '<span class="drag-hint">☰</span>' : ''}
            ${e.is_low_freq ? '<span class="low-tag">低频</span>' : ''}
            <span class="emoji">${escapeHtml(e.emoji || '📱')}</span>
            <span class="name">${escapeHtml(e.name || e.id || '')}</span>
        </button>
    `).join('');
    if (isEditing) {
        grid.innerHTML += `<button type="button" class="btn add-btn" onclick="openAdd()"><span class="emoji">+</span><span class="name">新增</span></button>`;
    }
}

function onDragStart(e, i) {
    if (!isEditing) { e.preventDefault(); return; }
    dragFrom = i;
    window.__didDrag = false;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(i)); } catch (_) {}
    e.currentTarget.classList.add('dragging');
}

function onDragOver(e, i) {
    if (!isEditing || dragFrom < 0) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

function onDrop(e, i) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!isEditing || dragFrom < 0 || dragFrom === i) return;
    window.__didDrag = true;
    const item = eventsList.splice(dragFrom, 1)[0];
    eventsList.splice(i, 0, item);
    dragFrom = -1;
    render();
    persistOrder();
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    dragFrom = -1;
    document.querySelectorAll('.btn.drag-over').forEach(el => el.classList.remove('drag-over'));
    setTimeout(() => { window.__didDrag = false; }, 50);
}

async function persistOrder() {
    const body = eventsList.map((e, i) => ({ id: e.id, sort_order: i }));
    try {
        const res = await fetch('/api/sources/reorder', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (!res.ok) showToast('排序保存失败', true);
        else showToast('顺序已保存');
    } catch (_) {
        showToast('排序保存失败', true);
    }
}

function adjustColor(hex, percent) {
    if (!hex || !hex.startsWith('#')) return '#8b949e';
    const num = parseInt(hex.slice(1), 16);
    if (isNaN(num)) return '#8b949e';
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editBtn');
    btn.classList.toggle('active', isEditing);
    btn.textContent = isEditing ? '完成' : '编辑';
    render();
}

function openAdd() {
    editingIndex = -1;
    document.getElementById('modalTitle').textContent = '添加事件类型';
    document.getElementById('saveBtn').textContent = '添加';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('eventName').value = '';
    document.getElementById('isLowFreq').checked = false;
    updateEmojiState('📱');
    updateColorState(colors[0]);
    document.getElementById('modal').classList.add('show');
}

function openEdit(index) {
    if (window.__didDrag) return;
    editingIndex = index;
    const e = eventsList[index];
    if (!e) return;
    document.getElementById('modalTitle').textContent = '修改事件类型';
    document.getElementById('saveBtn').textContent = '保存';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('eventName').value = (e.name || '').slice(0, 16);
    document.getElementById('isLowFreq').checked = !!e.is_low_freq;
    updateEmojiState(e.emoji || '📱');
    updateColorState(e.color || colors[0]);
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    editingIndex = -1;
}

function updateEmojiState(emojiStr) {
    selectedEmoji = emojiStr || '📱';
    const input = document.getElementById('customEmojiInput');
    if (input) input.value = selectedEmoji;
}

function onCustomEmojiInputChange(val) { selectedEmoji = val.trim() || '📱'; }

function renderColorPicker() {
    const cur = (selectedColor || '').toLowerCase();
    document.getElementById('colorPicker').innerHTML = colors.map(c =>
        `<div class="color-option ${c.toLowerCase() === cur ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
    ).join('');
}

function updateColorState(hex) {
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    const input = document.getElementById('hexColorInput');
    if (input) input.value = hex;
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) picker.value = hex;
    renderColorPicker();
}

function selectColor(c) { updateColorState(c); }
function onCustomColorPickerChange(val) { updateColorState(val); }

function onCustomHexInputChange(val) {
    let hex = val.trim();
    if (hex && !hex.startsWith('#')) hex = '#' + hex;
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) picker.value = hex;
    renderColorPicker();
}

async function saveEvent() {
    let name = document.getElementById('eventName').value.trim();
    if ([...name].length > 16) name = [...name].slice(0, 16).join('');
    const isLowFreq = document.getElementById('isLowFreq').checked;
    if (!name) { showToast('请填写名称', true); return; }
    if (!/^#[0-9A-Fa-f]{6}$/.test(selectedColor)) {
        showToast('请输入有效的 6 位 HEX 颜色', true);
        return;
    }
    const targetId = editingIndex >= 0 ? eventsList[editingIndex].id : generateUniqueSourceId();
    const payload = {
        id: targetId,
        name,
        emoji: selectedEmoji || '📱',
        color: selectedColor,
        is_low_freq: isLowFreq
    };
    try {
        const res = await fetch('/api/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (!res.ok) throw new Error('保存失败');
        showToast(editingIndex >= 0 ? '已保存' : '已添加');
        await initData();
        closeModal();
    } catch (e) {
        showToast('保存失败', true);
    }
}

function openDeleteConfirmModal() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;
    document.getElementById('deleteTargetName').textContent = target.name || target.id;
    document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteConfirmModal() {
    document.getElementById('deleteModal').classList.remove('show');
}

async function executeDelete() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;
    try {
        const res = await fetch(`/api/sources?source=${encodeURIComponent(target.id)}`, { method: 'DELETE' });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (!res.ok) throw new Error('删除失败');
        showToast('已删除');
        closeDeleteConfirmModal();
        closeModal();
        await initData();
    } catch (e) {
        showToast('删除失败', true);
    }
}

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
}

initData();
</script>
</body>
</html>
