<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="个人活动打卡与热力图">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Keep">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <title>Keep</title>
    <script>
    // 主题初始化：优先于 CSS 渲染执行，避免闪烁；默认跟随系统
    (function () {
        var p = localStorage.getItem('keep_theme') || 'system';
        var eff = p;
        if (p === 'system') {
            eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = eff;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', eff === 'dark' ? '#0d1117' : '#ffffff');
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --green-hover: #2ea043;
            --blue: #3b82f6;
            --orange: #f97316;
            --danger: #f85149;
            --accent: #58a6ff;
            --overlay: rgba(0,0,0,0.75);
            --modal-shadow: 0 10px 30px rgba(0,0,0,0.6);
            --toast-shadow: 0 4px 16px rgba(0,0,0,0.5);
            --btn-glow: rgba(35,134,54,0.3);
            --cell: #161b22;
            --cell-border: #0d1117;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --page-pad-x: clamp(0.5rem, 2vw, 2rem);
            --page-pad-y: clamp(0.6rem, 1.5vw, 2.5rem);
        }
        html[data-theme="light"] {
            color-scheme: light;
            --bg: #ffffff;
            --bg2: #f6f8fa;
            --bg3: #eaeef2;
            --text: #1f2328;
            --muted: #656d76;
            --border: #d0d7de;
            --green: #1a7f37;
            --green-hover: #2da44e;
            --blue: #0969da;
            --orange: #d97706;
            --danger: #cf222e;
            --accent: #0969da;
            --overlay: rgba(31,35,40,0.45);
            --modal-shadow: 0 10px 30px rgba(140,149,159,0.35);
            --toast-shadow: 0 4px 16px rgba(140,149,159,0.3);
            --btn-glow: rgba(26,127,55,0.25);
            --cell: #ebedf0;
            --cell-border: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100%;
            min-height: 100dvh;
            padding: var(--page-pad-y) var(--page-pad-x) calc(var(--page-pad-y) + var(--safe-bottom));
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: clamp(0.65rem, 1.5vw, 1.25rem);
        }
        h1 {
            text-align: center;
            font-size: clamp(1.25rem, 2.5vw + 0.6rem, 2.2rem);
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, var(--green), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
        }
        .source-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(0.3rem, 0.8vw, 0.5rem);
            justify-content: center;
            padding: clamp(0.45rem, 1.2vw, 0.75rem);
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            flex-shrink: 0;
        }
        .source-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: clamp(0.28rem, 0.8vw, 0.45rem) clamp(0.55rem, 1.5vw, 0.95rem);
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .source-tab:hover { color: var(--text); background: var(--bg3); }
        .source-tab.active {
            background: var(--bg3);
            color: var(--text);
            border-color: var(--border);
        }
        .source-tab .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .source-tab .count {
            background: var(--bg);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-size: 0.72em;
            color: var(--muted);
        }
        .source-tab.active .count { color: var(--text); }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(0.4rem, 1.2vw, 1.25rem);
            flex-shrink: 0;
        }
        .stat {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: clamp(0.65rem, 1.5vw, 1.3rem) clamp(0.4rem, 1vw, 1rem);
            text-align: center;
            min-width: 0;
        }
        .stat-val {
            font-size: clamp(1.15rem, 2.5vw + 0.4rem, 2.2rem);
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-lbl {
            font-size: clamp(0.62rem, 1.1vw, 0.8rem);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.2rem;
        }
        .graph-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(0.7rem, 1.8vw, 1.75rem);
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
        }
        .stats-btn {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 11px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }
        .stats-btn:hover { background: var(--green); color: #fff; }
        .graph-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(0.5rem, 1.2vw, 1rem);
            flex-wrap: wrap;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .graph-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            font-weight: 600;
            flex-wrap: wrap;
        }
        .graph-title .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.55rem;
            background: var(--bg3);
            border-radius: 16px;
            font-size: 0.8em;
            font-weight: 500;
        }
        .graph-title .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
        .record-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: clamp(0.3rem, 0.8vw, 0.45rem) clamp(0.75rem, 1.8vw, 1.1rem);
            border-radius: 16px;
            font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 2px 6px var(--btn-glow);
        }
        .record-btn:hover { background: var(--green-hover); transform: translateY(-1px); }
        .record-btn:active { transform: scale(0.95); }
        select {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.35rem 0.55rem;
            font-size: clamp(0.8rem, 1.4vw, 0.9rem);
            cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--green); }
        .heatmap-wrap {
            position: relative;
            z-index: 1;
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 1 1 auto;
            min-height: 0;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .heatmap-wrap::-webkit-scrollbar { display: none; }
        #heatmap {
            position: relative;
            min-width: 0;
            flex-shrink: 0;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        #hmMonthLabels {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 2;
        }
        #hmMonthLabels span {
            position: absolute;
            white-space: nowrap;
            color: var(--muted);
            font-size: var(--month-label-size, 13px);
            transform: translateX(-50%);
        }
        .hm-scrollbar {
            position: relative;
            display: none;
            height: 8px;
            margin-top: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            touch-action: none;
            flex-shrink: 0;
        }
        .hm-scroll-thumb {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            min-width: 24px;
            background: var(--green);
            border-radius: 8px;
            cursor: grab;
        }
        .hm-scroll-thumb:active { cursor: grabbing; }
        .legend {
            display: flex;
            justify-content: center;
            gap: clamp(0.6rem, 1.5vw, 1rem);
            margin-top: clamp(0.45rem, 1vw, 0.85rem);
            font-size: clamp(0.68rem, 1.2vw, 0.75rem);
            color: var(--muted);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .legend-item { display: flex; align-items: center; gap: 0.28rem; }
        .legend-box { width: 11px; height: 11px; border-radius: 2px; }
        footer {
            text-align: center;
            font-size: clamp(0.8rem, 1.4vw, 0.9rem);
            color: var(--muted);
            flex-shrink: 0;
            padding-top: 0.15rem;
        }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { color: var(--text); }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .custom-modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(14px, 3vw, 20px);
            width: 100%;
            max-width: min(420px, 94vw);
            max-height: min(90dvh, 90vh);
            overflow-y: auto;
            box-shadow: var(--modal-shadow);
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-close:hover { color: var(--text); }
        .event-scroll-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(6px, 1.5vw, 10px);
            max-height: min(380px, 50dvh);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 2px;
            user-select: none;
            -webkit-overflow-scrolling: touch;
        }
        .event-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            text-align: center;
        }
        .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .event-card:active { transform: scale(0.95); }
        .event-card .emoji { font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1; }
.event-card .name {
    font-size: clamp(0.7rem, 1.8vw, 0.8rem);
    font-weight: 500;
    color: var(--text);
    width: 100%;
    padding: 0 2px;
    text-align: center;
    line-height: 1.25;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .btn-modal {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-modal-cancel {
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-modal-confirm { background: var(--green); color: #fff; }
        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: min(420px, 60dvh);
            overflow-y: auto;
            padding: 2px;
        }
        .detail-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .detail-time {
            font-size: 1.05rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            min-width: 76px;
        }
        .detail-ctx {
            flex: 1;
            font-size: 0.85rem;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .detail-del {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 4px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .detail-del:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(248,81,73,0.1);
        }
        .detail-empty {
            text-align: center;
            color: var(--muted);
            padding: 28px 0;
            font-size: 0.9rem;
        }
        #toast {
            visibility: hidden;
            opacity: 0;
            background: var(--green);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--toast-shadow);
            transition: opacity 0.3s, visibility 0.3s;
            max-width: 90vw;
            text-align: center;
        }
        #toast.show { visibility: visible; opacity: 1; }
        .hm-body { display: flex; flex: 1 1 auto; min-height: 0; align-items: stretch; }
        .hm-weekcol {
            position: relative;
            flex: 0 0 18px;
            margin-right: 5px;
            padding-top: 2px;
        }
        .hm-week-item {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: var(--week-label-size, 10px);
            line-height: 1;
            user-select: none;
        }
        .theme-fab {
            position: fixed;
            right: 20px;
            bottom: calc(24px + var(--safe-bottom));
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg2);
            border: 1px solid var(--border);
            box-shadow: 0 4px 14px var(--btn-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 2100;
            transition: transform 0.2s;
        }
        .theme-fab:hover { transform: translateY(-2px) scale(1.05); }
        .theme-menu {
            position: fixed;
            right: 20px;
            bottom: calc(80px + var(--safe-bottom));
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--modal-shadow);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 2200;
            min-width: 104px;
        }
        .theme-menu.show { display: flex; }
        .theme-menu-item {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }
        .theme-menu-item:hover { background: var(--bg3); }
        .theme-menu-item.active { background: var(--bg3); color: var(--green); font-weight: 600; }
        @media (min-width: 1440px) {
            .container { max-width: 1600px; }
        }
        @media (max-width: 640px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .container { gap: 0.4rem; }
            .stats { grid-template-columns: repeat(4, 1fr); }
            .stat { padding: 0.4rem 0.3rem; }
            .stat-val { font-size: 1.1rem; }
            h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Keep 热力图</h1>
    <div class="source-tabs" id="sourceTabs"></div>
    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">总计</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statToday">0</div>
            <div class="stat-lbl">今日</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statStreak">0</div>
            <div class="stat-lbl">连续</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statSources">0</div>
            <div class="stat-lbl">事件类</div>
        </div>
    </div>
    <div class="graph-card">
        <div class="graph-header">
            <div class="graph-title">
                <span>活动</span>
                <span class="badge" id="currentBadge">
                    <span class="dot" id="badgeDot"></span>
                    <span id="badgeName">全部</span>
                </span>
                <button class="record-btn" id="recordBtn" onclick="handleRecordClick()">+ 记录</button>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <button class="stats-btn" id="statsBtn" style="display:none;" title="年度统计" onclick="location.href='/stats.html?year=' + encodeURIComponent(document.getElementById('year').value)">统计</button>
                <select id="combineMode" style="display:none;" title="合并方式">
                    <option value="winner">热度</option>
                    <option value="stack">总计</option>
                </select>
                <select id="year"></select>
            </div>
        </div>
        <div class="hm-body">
            <div class="hm-weekcol" id="hmWeekCol" title="星期">
                <span class="hm-week-item" data-w="0">一</span>
                <span class="hm-week-item" data-w="2">三</span>
                <span class="hm-week-item" data-w="4">五</span>
            </div>
            <div class="heatmap-wrap">
                <div id="heatmap"></div>
                <div id="hmMonthLabels"></div>
            </div>
        </div>
        <div class="hm-scrollbar" id="hmScrollbar">
            <div class="hm-scroll-thumb" id="hmScrollThumb"></div>
        </div>
        <div class="legend" id="legend"></div>
    </div>
    <footer>
        <span id="footerLinks"></span>
    </footer>
</div>

<div class="modal-overlay" id="selectModal">
    <div class="custom-modal">
        <div class="modal-header">
            <div class="modal-title">选择要记录的事件</div>
            <button class="modal-close" onclick="closeSelectModal()">×</button>
        </div>
        <div class="event-scroll-wrap" id="eventScrollContainer"></div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="custom-modal" style="max-width: 360px;">
        <div class="modal-title" style="margin-bottom:10px;">确认打卡</div>
        <p style="color:var(--muted);font-size:0.95rem;margin-bottom:20px;">
            确定要为「<strong id="targetEventName" style="color:var(--text)"></strong>」记录一次打卡吗？
        </p>
        <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeConfirmModal()">取消</button>
            <button class="btn-modal btn-modal-confirm" onclick="submitLog()">确定</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="detailModal">
    <div class="custom-modal" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title" id="detailTitle">打卡详情</div>
            <button class="modal-close" onclick="closeDetailModal()">×</button>
        </div>
        <div class="detail-list" id="detailList"></div>
    </div>
</div>

<div class="modal-overlay" id="delConfirmModal">
    <div class="custom-modal" style="max-width: 360px;">
        <div class="modal-title" style="margin-bottom:10px;">确认删除</div>
        <p style="color:var(--muted);font-size:0.95rem;margin-bottom:20px;">
            确定要删除 <strong id="delTargetDesc" style="color:var(--text)"></strong> 这条记录吗？
        </p>
        <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeDelConfirmModal()">取消</button>
            <button class="btn-modal btn-modal-confirm" onclick="confirmDelete()">删除</button>
        </div>
    </div>
</div>

<div class="theme-fab" id="themeFab" title="颜色模式"><span>💡</span></div>
<div class="theme-menu" id="themeMenu">
    <div class="theme-menu-item" data-theme-opt="system">系统</div>
    <div class="theme-menu-item" data-theme-opt="light">浅色</div>
    <div class="theme-menu-item" data-theme-opt="dark">深色</div>
</div>

<div id="toast">✅ 记录成功！</div>


<script>
const DEFAULT_PRESETS = {
    'default': { rgb: '139,148,158', hex: '#8b949e', name: '其他', is_low_freq: false }
};
let sourceColors = { ...DEFAULT_PRESETS };

function hexToRgb(hex) {
    if (!hex || !hex.startsWith('#')) return '139,148,158';
    const n = parseInt(hex.slice(1), 16);
    if (isNaN(n)) return '139,148,158';
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

async function loadSourceColorsFromDB() {
    const map = { ...DEFAULT_PRESETS };
    try {
        const res = await fetch('/api/sources');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list)) {
                list.forEach(e => {
                    if (!e.id) return;
                    map[e.id] = {
                        rgb: hexToRgb(e.color),
                        hex: e.color || '#8b949e',
                        name: e.name || e.id,
                        emoji: e.emoji || '📱',
                        is_low_freq: !!e.is_low_freq
                    };
                });
            }
        }
    } catch (e) {
        console.warn('Failed to load sources from database');
    }
    sourceColors = map;
}

function getColor(id) {
    if (!sourceColors[id]) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
            hash = id.charCodeAt(i) + ((hash << 5) - hash);
        }
        const c = Math.abs(hash).toString(16);
        const hex = '#' + '000000'.substring(0, 6 - c.length) + c;
        sourceColors[id] = {
            rgb: hexToRgb(hex),
            hex: hex,
            name: id,
            emoji: '📱',
            is_low_freq: false
        };
    }
    return sourceColors[id];
}

let year = parseInt(localStorage.getItem('dashboard_year')) || new Date().getFullYear();
let currentSource = localStorage.getItem('dashboard_source') || 'combined';
let combineMode = localStorage.getItem('dashboard_combine_mode') || 'winner';
let pendingTargetSource = null;
let allData = [];
let statsData = {};
let chart = null;

function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// ============ 主题切换 ============
let themePref = localStorage.getItem('keep_theme') || 'system';

function currentTheme() {
    if (themePref === 'system') {
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    return themePref;
}

function applyTheme() {
    const eff = currentTheme();
    document.documentElement.dataset.theme = eff;
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', eff === 'dark' ? '#0d1117' : '#ffffff');
    // 主题变化需重建图表（ECharts 主题在 init 时生效）
    if (chart) {
        try { chart.dispose(); } catch (_) {}
        chart = null;
    }
    if (allData) renderHeatmap();
    updateThemeMenu();
}

function setThemePref(p) {
    themePref = p;
    localStorage.setItem('keep_theme', p);
    applyTheme();
}

function updateThemeMenu() {
    const items = document.querySelectorAll('.theme-menu-item');
    items.forEach(function (el) {
        el.classList.toggle('active', el.dataset.themeOpt === themePref);
    });
}

// 常驻星期列（一/三/五）：固定在热力图左侧不随滚动，行位严格对齐日历格子行
// 直接用 convertToPixel 取当年 1 月首个周一/周三/周五所在行的真实网格 y（与 ECharts 渲染一致）
function layoutWeekLabels() {
    const col = document.getElementById('hmWeekCol');
    const wrap = document.querySelector('.heatmap-wrap');
    const hm = document.getElementById('heatmap');
    if (!col || !wrap || !hm || !chart || chart.isDisposed()) return;
    const hmR = hm.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    const topOff = hmR.top - wr.top;
    const y = year || 2026;
    const jan1 = new Date(y, 0, 1);
    const monday = 1 + (((8 - jan1.getDay()) % 7) || 0);  // 1 月首个周一
    const rows = [monday, monday + 2, monday + 4];        // 周一 / 周三 / 周五
    col.querySelectorAll('.hm-week-item').forEach(function (el, i) {
        const dateStr = y + '-' + String(1).padStart(2, '0') + '-' + String(rows[i]).padStart(2, '0');
        const px = chart.convertToPixel({ coordSysName: 'calendar', calendarIndex: 0 }, dateStr);
        if (px && typeof px[1] === 'number') {
            el.style.top = (topOff + px[1]) + 'px';
        }
    });
}

// ============ 热力图横向进度条 ============
function syncScrollbar() {
    const track = document.getElementById('hmScrollbar');
    const thumb = document.getElementById('hmScrollThumb');
    const wrap = document.querySelector('.heatmap-wrap');
    if (!track || !thumb || !wrap) return;
    const maxScroll = wrap.scrollWidth - wrap.clientWidth;
    if (maxScroll <= 0) { track.style.display = 'none'; return; }
    track.style.display = 'block';
    const tw = track.clientWidth;
    const thw = thumb.offsetWidth;
    const p = wrap.scrollLeft / maxScroll;
    thumb.style.left = Math.round(p * (tw - thw)) + 'px';
}

// 需要滚动时，页面打开后的首次渲染把当前月份放到合适位置，不用手动滑动找：
// 前后内容都充足 → 当前月居中；当前月靠后（如 12 月，右侧内容不足半屏）→ 贴右缘，
// 左侧完整显示之前的月份，避免"当前月居中、右侧一大片空白"；靠前（如 1 月）→ 贴左。
// 返回 true 表示已成功定位（调用方据此决定不再重试）
function centerOnCurrentMonth(wrap, cell) {
    const scrollW = wrap.scrollWidth;
    const cw = wrap.clientWidth;
    const maxScroll = scrollW - cw;
    if (maxScroll <= 0) return false;
    const m = new Date().getMonth() + 1;
    const dateStr = year + '-' + String(m).padStart(2, '0') + '-01';
    const px = chart.convertToPixel({ coordSysName: 'calendar', calendarIndex: 0 }, dateStr);
    if (!px || typeof px[0] !== 'number') return false;
    const monthCols = weeksBetweenMonths(year, m, m);
    const midX = px[0] + (monthCols - 1) * cell / 2;
    let target;
    if (midX + cw / 2 > scrollW) {
        target = maxScroll; // 右侧内容不足半屏 → 当前月贴右缘
    } else if (midX < cw / 2) {
        target = 0; // 当前月太靠前 → 贴左
    } else {
        target = midX - cw / 2; // 前后都充足 → 居中
    }
    target = Math.max(0, Math.min(maxScroll, target));
    wrap.scrollLeft = target;
    syncScrollbar();
    layoutMonthLabels();
    return true;
}

// 月份标签覆盖层：标签贴在各自月份首日所在列的中心。
// 标签层绝对定位在滚动容器(.heatmap-wrap)内部，会随内容一起滚动，
// 因此 left 用内容坐标(px[0])即可与格子列天然对齐（不能再减 scrollLeft，否则双重偏移）；
// 隐藏判断用屏幕坐标（内容坐标 - scrollLeft），右缘被切掉或滚出可视区时隐藏，避免"4月露头"
function layoutMonthLabels() {
    const el = document.getElementById('hmMonthLabels');
    const wrap = document.querySelector('.heatmap-wrap');
    if (!el || !chart || chart.isDisposed()) return;
    if (!el.__spans) {
        el.__spans = [];
        for (let m = 1; m <= 12; m++) {
            const span = document.createElement('span');
            span.textContent = m + '月';
            el.appendChild(span);
            el.__spans.push(span);
        }
    }
    const cw = wrap.clientWidth;
    const sl = wrap.scrollLeft;
    // heatmap 在 wrap 内的布局偏移（内容不满时会被 justify-content 居中偏移）：
    // 标签层 absolute 钉在 wrap 左缘，必须加上该偏移才能与格子列同参考系
    const hmEl = document.getElementById('heatmap');
    const off = hmEl ? hmEl.offsetLeft : 0;
    for (let m = 1; m <= 12; m++) {
        const span = el.__spans[m - 1];
        const dateStr = year + '-' + String(m).padStart(2, '0') + '-01';
        const px = chart.convertToPixel({ coordSysName: 'calendar', calendarIndex: 0 }, dateStr);
        if (!px || typeof px[0] !== 'number') { span.style.visibility = 'hidden'; continue; }
        span.style.left = (px[0] + off) + 'px';
        // 标签需整体在可视区内才显示：中心离左缘不足半宽（或超出右缘）→ 隐藏，避免半截"月"字
        const hw = span.offsetWidth / 2;
        const sx = px[0] + off - sl;
        span.style.visibility = (sx < hw + 4 || sx > cw - hw - 4) ? 'hidden' : 'visible';
    }
}

// ============ 初始化 ============
async function loadMe() {
    try {
        const res = await fetch('/api/me');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            window.__me = await res.json();
            renderFooterLinks();
        }
    } catch (_) {}
}

function renderFooterLinks() {
    const el = document.getElementById('footerLinks');
    const me = window.__me;
    if (!el || !me) return;
    let html = '';
    // 所有登录用户均可管理自己的事件类型；管理员额外显示用户管理
    html += '<a href="/manage.html">⚙️ 事件类型配置</a>';
    if (me.role === 'admin') {
        html += ' &nbsp;<a href="/users.html">👥 用户管理</a>';
    }
    if (me.username) {
        html += ' &nbsp;<span style="opacity:.75">' + escapeHtml(me.username) + '</span>';
        html += ' &nbsp;<a href="#" onclick="doLogout(event)">退出</a>';
    }
    el.innerHTML = html;
}

async function doLogout(e) {
    e.preventDefault();
    try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
    window.location.href = '/login.html';
}

async function init() {
    await loadMe();
    await loadSourceColorsFromDB();
    const yearSel = document.getElementById('year');
    const cy = new Date().getFullYear();
    yearSel.innerHTML = '';
    for (let y = cy; y >= cy - 5; y--) {
        yearSel.innerHTML += `<option value="${y}" ${y===year?'selected':''}>${y}</option>`;
    }
    yearSel.onchange = async () => {
        year = parseInt(yearSel.value);
        localStorage.setItem('dashboard_year', year);
        await loadData();
        render();
    };
    const modeSel = document.getElementById('combineMode');
    modeSel.value = combineMode;
    modeSel.onchange = () => {
        combineMode = modeSel.value;
        localStorage.setItem('dashboard_combine_mode', combineMode);
        renderHeatmap();
    };

    // 主题按钮与菜单
    const fab = document.getElementById('themeFab');
    const menu = document.getElementById('themeMenu');
    fab.addEventListener('click', function (e) {
        e.stopPropagation();
        menu.classList.toggle('show');
    });
    document.addEventListener('click', function (e) {
        if (!menu.contains(e.target) && !fab.contains(e.target)) menu.classList.remove('show');
    });
    menu.querySelectorAll('.theme-menu-item').forEach(function (el) {
        el.addEventListener('click', function () { setThemePref(el.dataset.themeOpt); menu.classList.remove('show'); });
    });
    // 跟随系统主题变化
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    const onSysChange = function () { if (themePref === 'system') applyTheme(); };
    if (mq && mq.addEventListener) mq.addEventListener('change', onSysChange);
    else if (mq && mq.addListener) mq.addListener(onSysChange);
    updateThemeMenu();

    await loadStats();
    await loadData();
    render();

    // 热力图横向滚动：进度条同步 + 拖拽/点击 + 滚轮横向
    const heatWrap = document.querySelector('.heatmap-wrap');
    const track = document.getElementById('hmScrollbar');
    const thumb = document.getElementById('hmScrollThumb');
    if (heatWrap && track && thumb) {
        heatWrap.addEventListener('scroll', function () {
            if (window.__sbRaf) return;
            window.__sbRaf = requestAnimationFrame(function () {
                window.__sbRaf = 0;
                syncScrollbar();
                layoutMonthLabels();
            });
        });
        heatWrap.addEventListener('wheel', function (e) {
            if (heatWrap.scrollWidth <= heatWrap.clientWidth) return;
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) return;
            heatWrap.scrollLeft += e.deltaY;
            e.preventDefault();
        }, { passive: false });
        track.addEventListener('pointerdown', function (e) {
            const tw = track.clientWidth - thumb.offsetWidth;
            const wrap = heatWrap;
            if (e.target === thumb) {
                const startX = e.clientX;
                const startLeft = thumb.offsetLeft;
                const move = function (ev) {
                    let nl = startLeft + (ev.clientX - startX);
                    nl = Math.max(0, Math.min(tw, nl));
                    thumb.style.left = nl + 'px';
                    wrap.scrollLeft = (nl / tw) * (wrap.scrollWidth - wrap.clientWidth);
                };
                const up = function () {
                    document.removeEventListener('pointermove', move);
                    document.removeEventListener('pointerup', up);
                };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
            } else {
                const rect = track.getBoundingClientRect();
                let nl = e.clientX - rect.left - thumb.offsetWidth / 2;
                nl = Math.max(0, Math.min(tw, nl));
                thumb.style.left = nl + 'px';
                wrap.scrollLeft = (nl / tw) * (wrap.scrollWidth - wrap.clientWidth);
            }
            e.preventDefault();
        });
    }

    // 详情弹窗只能点右上角 × 关闭（点击遮罩/滑动屏幕不会关闭它）；
    // 点击遮罩仅隐藏小提示框（日期+次数），详情大页保持打开
    const detailOv = document.getElementById('detailModal');
    detailOv.addEventListener('click', function (e) {
        if (e.target === detailOv) {
            if (chart && !chart.isDisposed()) chart.dispatchAction({ type: 'hideTip' });
        }
        e.stopPropagation();
    });

    // 小提示框：触摸屏幕任意处即隐藏（含滑动）；点击热力图之外的位置也隐藏
    document.addEventListener('touchstart', function (e) {
        if (chart && !chart.isDisposed()) chart.dispatchAction({ type: 'hideTip' });
    }, { capture: true });
    document.addEventListener('click', function (e) {
        if (!(e.target && e.target.closest && e.target.closest('#heatmap'))) {
            if (chart && !chart.isDisposed()) chart.dispatchAction({ type: 'hideTip' });
        }
    });

    setInterval(async () => {
        await loadSourceColorsFromDB();
        await loadStats();
        await loadData();
        render();
    }, 30000);
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        statsData = await res.json();
    } catch (_) {
        statsData = {};
    }
}

async function loadData() {
    try {
        const res = await fetch(`/api/contributions?year=${year}`);
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        allData = await res.json() || [];
    } catch (_) {
        allData = [];
    }
}

function handleRecordClick() {
    if (currentSource === 'combined') openSelectEventModal();
    else promptConfirmLog(currentSource);
}

function openSelectEventModal() {
    const container = document.getElementById('eventScrollContainer');
    const keys = Object.keys(sourceColors).filter(k => k !== 'default');
    if (keys.length === 0) {
        container.innerHTML = '<div style="color:var(--muted);padding:20px;grid-column:span 3;text-align:center;">暂无可用事件，请先在事件配置页面添加。</div>';
    } else {
        let html = '';
        keys.forEach(id => {
            const info = getColor(id);
html += `<div class="event-card" onclick="promptConfirmLog('${id}')">
    <span class="emoji">${info.emoji || '📱'}</span>
    <span class="name">${(info.name || id).slice(0, 16)}</span>
</div>`;
        });
        container.innerHTML = html;
    }
    document.getElementById('selectModal').classList.add('show');
}

function closeSelectModal() {
    document.getElementById('selectModal').classList.remove('show');
}

function promptConfirmLog(sourceId) {
    pendingTargetSource = sourceId;
    const info = getColor(sourceId);
    document.getElementById('targetEventName').textContent = info.name || sourceId;
    closeSelectModal();
    document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('show');
    pendingTargetSource = null;
}

async function submitLog() {
    if (!pendingTargetSource) return;
    const target = pendingTargetSource;
    closeConfirmModal();
    try {
        const res = await fetch('/api/contributions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([{
                source: target,
                context: 'manual',
                timestamp: new Date().toISOString(),
                metadata: { device: 'web', manual: true }
            }])
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            showToast('✅ 记录成功！');
            await loadStats();
            await loadData();
            render();
        } else showToast('❌ 记录失败，请重试');
    } catch (e) {
        showToast('❌ 网络请求失败');
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
}

function fmtTime(t) {
    // 屏蔽秒钟：一律只显示 HH:mm
    if (!t) return '';
    if (t.length >= 16) return t.slice(11, 16);
    return t;
}

// 触控端判定：触控设备不显示悬停 tooltip（点击格子直接弹详情）
function isTouchDevice() {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
}

// 计算某月区间跨过的周列数（以周一为一周起点），用于自适应格子尺寸
function weeksBetweenMonths(y, s, e) {
    const start = new Date(y, s - 1, 1);
    const end = new Date(y, e, 0);
    const msPerDay = 86400000;
    const monday = new Date(start);
    monday.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    const sunday = new Date(end);
    sunday.setDate(end.getDate() + ((7 - end.getDay()) % 7));
    return Math.floor((sunday - monday) / msPerDay / 7) + 1;
}

let detailDate = null;
let detailRecords = [];
let pendingDeleteId = null;

function onHeatmapClick(params) {
    // 仅在具体事件视图下生效，全部视图点击不弹窗
    if (currentSource === 'combined') return;
    if (!params || !params.data || !params.data.value) return;
    const date = params.data.value[0];
    if (!date) return;
    const recs = (allData || []).filter(function (c) {
        return c.source === currentSource &&
            (c.local_date || (c.timestamp || '').slice(0, 10)) === date;
    });
    if (recs.length === 0) { showToast('当天没有记录'); return; }
    detailDate = date;
    detailRecords = recs.slice().sort(function (a, b) {
        return (a.timestamp || '').localeCompare(b.timestamp || '');
    });
    openDetailModal();
}

function openDetailModal() {
    const info = getColor(currentSource);
    const name = escapeHtml(info.name || currentSource);
    document.getElementById('detailTitle').textContent = '「' + name + '」 ' + detailDate + ' 记录';
    renderDetailList();
    document.getElementById('detailModal').classList.add('show');
}

function renderDetailList() {
    const wrap = document.getElementById('detailList');
    if (!detailRecords.length) {
        wrap.innerHTML = '<div class="detail-empty">当天没有记录</div>';
        return;
    }
    wrap.innerHTML = detailRecords.map(function (c) {
        const hm = fmtTime(c.timestamp);
        const ctx = (c.context && c.context !== 'manual') ? c.context : '';
        return '<div class="detail-row">' +
            '<span class="detail-time">' + hm + '</span>' +
            '<span class="detail-ctx">' + escapeHtml(ctx) + '</span>' +
            '<button class="detail-del" onclick="requestDelete(' + c.id + ')">删除</button>' +
            '</div>';
    }).join('');
}

function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('show');
    document.getElementById('detailList').innerHTML = '';
    if (chart && !chart.isDisposed()) chart.dispatchAction({ type: 'hideTip' });
    detailDate = null;
    detailRecords = [];
    pendingDeleteId = null;
}


function requestDelete(id) {
    pendingDeleteId = id;
    let rec = null;
    detailRecords.forEach(function (c) { if (c.id === id) rec = c; });
    const hm = rec ? fmtTime(rec.timestamp) : '';
    const ctx = rec && rec.context && rec.context !== 'manual' ? '（' + rec.context + '）' : '';
    document.getElementById('delTargetDesc').textContent = (detailDate || '') + ' ' + hm + ctx;
    document.getElementById('delConfirmModal').classList.add('show');
}

function closeDelConfirmModal() {
    document.getElementById('delConfirmModal').classList.remove('show');
    pendingDeleteId = null;
}

async function confirmDelete() {
    const id = pendingDeleteId;
    if (id == null) return;
    closeDelConfirmModal();
    try {
        const res = await fetch('/api/contributions?id=' + encodeURIComponent(id), { method: 'DELETE' });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            allData = allData.filter(function (c) { return c.id !== id; });
            showToast('🗑️ 已删除');
            await loadStats();
            render();
            const recs = (allData || []).filter(function (c) {
                return c.source === currentSource &&
                    (c.local_date || (c.timestamp || '').slice(0, 10)) === detailDate;
            });
            detailRecords = recs.slice().sort(function (a, b) {
                return (a.timestamp || '').localeCompare(b.timestamp || '');
            });
            if (detailRecords.length === 0) { closeDetailModal(); return; }
            renderDetailList();
        } else {
            showToast('❌ 删除失败，请重试');
        }
    } catch (e) {
        showToast('❌ 网络请求失败');
    }
}

function render() {
    renderTabs();
    renderStats();
    renderHeatmap();
}

function renderTabs() {
    const bySource = {};
    allData.forEach(c => { bySource[c.source] = (bySource[c.source] || 0) + 1; });
    if (currentSource !== 'combined' && !bySource[currentSource]) {
        currentSource = 'combined';
        localStorage.setItem('dashboard_source', 'combined');
    }
    const tabs = document.getElementById('sourceTabs');
    let html = tabHtml('combined', '全部', allData.length, 'linear-gradient(135deg,#238636,#3b82f6)');
    Object.entries(bySource).sort((a, b) => b[1] - a[1]).forEach(([id, cnt]) => {
        const c = getColor(id);
        html += tabHtml(id, c.name, cnt, c.hex);
    });
    tabs.innerHTML = html;
    tabs.querySelectorAll('.source-tab').forEach(el => {
        el.onclick = () => {
            currentSource = el.dataset.id;
            localStorage.setItem('dashboard_source', currentSource);
            render();
        };
    });
}

function tabHtml(id, name, count, color) {
    const active = currentSource === id ? 'active' : '';
    return `<button class="source-tab ${active}" data-id="${id}">
        <span class="dot" style="background:${color}"></span>
        ${name}<span class="count">${count}</span>
    </button>`;
}

function renderStats() {
    const bySource = statsData.by_source || {};
    const now = new Date();
    const todayStr = statsData.today_date || [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0')
    ].join('-');
    let total, today;
    if (currentSource === 'combined') {
        total = allData.length;
        today = allData.filter(c => (c.local_date || (c.timestamp || '').slice(0, 10)) === todayStr).length;
    } else {
        const filtered = allData.filter(c => c.source === currentSource);
        total = filtered.length;
        today = filtered.filter(c => (c.local_date || (c.timestamp || '').slice(0, 10)) === todayStr).length;
    }
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statStreak').textContent = statsData.current_streak || 0;
    document.getElementById('statSources').textContent = Object.keys(bySource).length;
}

function renderHeatmap() {
    const isCombined = currentSource === 'combined';
    document.getElementById('combineMode').style.display = isCombined ? '' : 'none';
    document.getElementById('statsBtn').style.display = isCombined ? '' : 'none';
    const c = isCombined
        ? { hex: 'linear-gradient(135deg,#238636,#3b82f6)', name: '全部' }
        : getColor(currentSource);
    document.getElementById('badgeDot').style.background =
        typeof c.hex === 'string' && c.hex.startsWith('#') ? c.hex : '#238636';
    document.getElementById('badgeName').textContent = c.name || currentSource;

    const data = isCombined ? allData : allData.filter(x => x.source === currentSource);
    const days = {};
    data.forEach(item => {
        const dt = item.local_date || (item.timestamp || '').split('T')[0];
        if (!dt) return;
        if (!days[dt]) days[dt] = { total: 0, src: {} };
        days[dt].total++;
        days[dt].src[item.source] = (days[dt].src[item.source] || 0) + 1;
    });

    // canvas 不支持 CSS 变量，取计算后的颜色值
    const cs = getComputedStyle(document.documentElement);
    const cv = (n, fb) => { const v = cs.getPropertyValue(n).trim(); return v || fb; };
    const cCell = cv('--cell', '#161b22');
    const cCellBorder = cv('--cell-border', '#0d1117');
    const cMuted = cv('--muted', '#8b949e');

    const chartData = Object.entries(days).map(([date, stats]) => {
        let color;
        if (isCombined) color = getCombinedColor(stats);
        else {
            const sc = getColor(currentSource);
            let opacity;
            if (sc.is_low_freq) {
                // 低频事件：1次=较多档(0.85)，2次及以上=最高档(1.0)
                opacity = stats.total >= 2 ? 1.0 : 0.85;
            } else {
                // 贴合图例四档亮度：1次=少、2次=中、3次=较多、4次及以上=多（最高亮度）
                const step = [0.35, 0.65, 0.85, 1.0];
                opacity = stats.total >= 4 ? 1.0 : step[Math.max(0, stats.total - 1)];
            }
            color = `rgba(${sc.rgb},${opacity})`;
        }
        return {
            value: [date, stats.total],
            itemStyle: { color, borderColor: cCellBorder, borderWidth: 1, borderRadius: 2 }
        };
    });

    const legendColor = isCombined ? { rgb: '35,134,54', hex: '#238636' } : getColor(currentSource);
    // 总计模式亮度档位为 0/3/6/9/12，图例同步显示；普通/热度模式显示 无/少/中/较多/多
    const lv = (isCombined && combineMode === 'stack') ? ['0', '1-5', '6-10', '11-15', '16+'] : ['无', '少', '中', '较多', '多'];
    document.getElementById('legend').innerHTML = `
        <div class="legend-item"><div class="legend-box" style="background:${cCell}"></div>${lv[0]}</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.35)"></div>${lv[1]}</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.65)"></div>${lv[2]}</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.85)"></div>${lv[3]}</div>
        <div class="legend-item"><div class="legend-box" style="background:${legendColor.hex}"></div>${lv[4]}</div>
    `;

    const el = document.getElementById('heatmap');
    const wrap = el.parentElement;
    const vw = window.innerWidth || 800;
    const vh = window.innerHeight || 600;
    const isNarrow = vw < 640;
    const isTablet = vw >= 640 && vw < 1024;

    // 自适应可见月数：手机≥3个月、平板约6个月、中屏约8个月、桌面(≥1280)完整12个月
    // 整年连续渲染不切断，超出可视区域时左右滑动 + 进度条查看
    const targetMonths = vw < 640 ? 3 : vw < 1024 ? 6 : vw < 1280 ? 8 : 12;
    // 滚动视图（手机/平板）减去"跨月边界列"（该列同时含上月末+下月初，
    // 完整显示它必然带出下月前几天），从而让 3/6 个月窗口内零露出下月内容
    const fullCols = weeksBetweenMonths(year, 1, targetMonths);
    const targetCols = vw < 1280 ? Math.max(1, fullCols - 1) : fullCols;
    const calCols = 53;
    const calRange = year.toString();

    void wrap.offsetWidth;
    let avail = wrap.clientWidth || vw;
    if (avail < 80) avail = vw - 24;

    const leftPad = 2;
    // 滚动视图（手机/平板）右缘贴边，让"跨月边界列"整列压在视口外；桌面完整展示留右边距
    const rightPad = vw < 1280 ? 0 : 24;
    let cell;
    if (vw < 1280) {
        // 小数格子：让前 targetCols 列恰好填满可视宽度，
        // 下一列（跨月边界列）整列压在右缘外，滚动窗口内零露出下月内容
        cell = (avail - leftPad - rightPad) / targetCols;
        cell = Math.max(10, Math.min(32, cell));
    } else {
        cell = Math.floor((avail - leftPad - rightPad) / targetCols);
        cell = Math.max(10, Math.min(32, cell));
    }

    const usedOutside =
        (document.querySelector('h1')?.offsetHeight || 40) +
        (document.getElementById('sourceTabs')?.offsetHeight || 48) +
        (document.querySelector('.stats')?.offsetHeight || 80) +
        (document.querySelector('.graph-header')?.offsetHeight || 40) +
        (document.getElementById('legend')?.offsetHeight || 28) +
        (document.querySelector('footer')?.offsetHeight || 28) + 80;

    const maxGraphH = Math.max(110, Math.min(vh - usedOutside, isNarrow ? 300 : (isTablet ? 260 : 340)));
    let graphH = Math.round(cell * 7 + (isNarrow ? 36 : 48));
    if (graphH > maxGraphH) {
        graphH = maxGraphH;
        const cellByH = Math.floor((graphH - (isNarrow ? 36 : 48)) / 7);
        if (cellByH > 0 && cellByH < cell) cell = Math.max(10, cellByH);
    }
    const graphW = calCols * cell + leftPad + rightPad;
    el.style.width = graphW + 'px';
    el.style.height = graphH + 'px';
    // 超出容器时左对齐以便横向滚动，未超出时居中
    wrap.style.justifyContent = graphW > avail ? 'flex-start' : 'center';

    const draw = () => {
        if (chart && isIOSDevice()) {
            try { chart.dispose(); } catch (_) {}
            chart = null;
        }
        const eTheme = (document.documentElement.dataset.theme === 'light') ? 'light' : 'dark';
        if (!chart) {
            chart = echarts.init(el, eTheme, { width: graphW, height: graphH, renderer: 'canvas' });
            chart.on('click', onHeatmapClick);
        } else {
            chart.resize({ width: graphW, height: graphH });
        }
        const labelSize = Math.max(9, Math.min(13, Math.floor(cell * 0.7)));
        const monthSize = Math.max(10, Math.min(13, Math.floor(cell * 0.75)));
        document.documentElement.style.setProperty('--month-label-size', monthSize + 'px');
        document.documentElement.style.setProperty('--week-label-size', labelSize + 'px');
        chart.setOption({
            backgroundColor: 'transparent',
            animation: false,
            tooltip: {
                show: !isTouchDevice(),  // 触控端不显示 tooltip（点击格子直接弹详情），仅 PC 悬停
                appendToBody: true,
                confine: false,
                triggerOn: 'mousemove',
                extraCssText: 'z-index: 9999; pointer-events: none;',
                position: function (point, params, dom, rect, size) {
                    return [point[0], Math.max(8, point[1] - size.contentSize[1] - 12)];
                },
                formatter: p => {
                    if (!p.data || !p.data.value) return '';
                    const date = p.data.value[0];
                    const count = p.data.value[1];
                    const dayStats = days[date];
                    let tip = `<b>${date}</b><br/>${count} 次`;
                    if (isCombined && dayStats) {
                        tip += '<br/>';
                        Object.entries(dayStats.src).sort((a, b) => b[1] - a[1]).forEach(([src, cnt]) => {
                            const info = getColor(src);
                            tip += `<br/><span style="color:${info.hex}">●</span> ${info.name}：${cnt}`;
                        });
                    }
                    return tip;
                }
            },
            calendar: {
                top: isNarrow ? 16 : Math.max(22, cell * 1.2),
                left: leftPad,
                right: rightPad,
                cellSize: [cell, cell],
                range: calRange,
                itemStyle: { color: cCell, borderColor: cCellBorder, borderWidth: 1 },
                splitLine: { show: false },
                yearLabel: { show: false },
                dayLabel: { show: false, firstDay: 1 },  // 一周从周一开始（1=周一，"一"在最顶行）；一/三/五 由外部常驻星期列显示
                monthLabel: { show: false }  // 月份标签改用 HTML 覆盖层（可在边缘被切时隐藏）
            },
            series: { type: 'heatmap', coordinateSystem: 'calendar', data: chartData }
        }, true);
        requestAnimationFrame(() => {
            if (chart && !chart.isDisposed()) chart.resize({ width: graphW, height: graphH });
            syncScrollbar();
            layoutMonthLabels();
            layoutWeekLabels();
            if (!window.__initedCentered) {
                if (centerOnCurrentMonth(wrap, cell)) window.__initedCentered = true;
            }
        });
    };
    requestAnimationFrame(draw);
}

function getCombinedColor(stats) {
    const sources = Object.entries(stats.src);
    // 贴合图例四档亮度：1次=少、2次=中、3次=较多、4次及以上=多（最高亮度）
    const step = [0.35, 0.65, 0.85, 1.0];
    const op = (t) => t >= 4 ? 1.0 : step[Math.max(0, t - 1)];
    if (combineMode === 'winner') {
        let winner = 'default', max = 0;
        sources.forEach(([src, cnt]) => { if (cnt > max) { max = cnt; winner = src; } });
        const sc = getColor(winner);
        const opacity = sc.is_low_freq
            ? (stats.total >= 2 ? 1.0 : 0.85)
            : op(stats.total);
        return `rgba(${sc.rgb},${opacity})`;
    }
    // 总计：亮度按 0/1-5/6-10/11-15/16+ 分档（独立于普通 0/1/2/3/4），0 次空白
    const totalStep = (t) => t <= 0 ? 0 : (t <= 5 ? 0.35 : (t <= 10 ? 0.65 : (t <= 15 ? 0.85 : 1.0)));
    return `rgba(35,134,54,${totalStep(stats.total)})`;
}

    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => { if (allData) renderHeatmap(); }, 200);
});
window.addEventListener('orientationchange', () => {
    setTimeout(() => { if (allData) renderHeatmap(); }, 300);
});

            console.log('[PWA] Service Worker registered');
        }).catch((err) => {
            console.error('[PWA] Service Worker registration failed:', err);
        });
    });
}
