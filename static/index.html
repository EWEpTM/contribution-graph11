<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Keep</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --green-hover: #2ea043;
            --blue: #3b82f6;
            --orange: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #238636, #58a6ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 来源 Tab */
        .source-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.75rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.25rem;
        }
        .source-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .source-tab:hover { color: var(--text); background: var(--bg3); }
        .source-tab.active {
            background: var(--bg3);
            color: var(--text);
            border-color: var(--border);
        }
        .source-tab .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .source-tab .count {
            background: var(--bg);
            padding: 0.1rem 0.45rem;
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .source-tab.active .count { color: var(--text); }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .stat {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 0.75rem;
            text-align: center;
        }
        .stat-val {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-lbl {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.25rem;
        }

        /* 热力图卡片 */
        .graph-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .graph-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .graph-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .graph-title .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            background: var(--bg3);
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .graph-title .badge .dot {
            width: 8px; height: 8px; border-radius: 50%;
        }

        /* 常驻记录按钮 */
        .record-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 0.3rem 0.85rem;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 2px 6px rgba(35,134,54,0.3);
        }
        .record-btn:hover {
            background: var(--green-hover);
            transform: translateY(-1px);
        }
        .record-btn:active {
            transform: scale(0.95);
        }

        select {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.65rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--green); }

        .heatmap-wrap {
            position: relative;
            z-index: 1;
            overflow-x: auto;
            overflow-y: visible;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            padding-bottom: 4px;
        }
        #heatmap {
            height: 170px;
            min-width: 0;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.85rem;
            font-size: 0.75rem;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .legend-box {
            width: 11px; height: 11px;
            border-radius: 2px;
        }

        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        footer a:hover { color: var(--text); }

        /* ========== 内置模态框样式 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
        }
        .custom-modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-close:hover { color: var(--text); }

        /* 两排滑动网格 */
        .event-scroll-wrap {
            display: grid;
            grid-template-rows: repeat(2, minmax(50px, auto));
            grid-auto-flow: column;
            grid-auto-columns: minmax(130px, max-content);
            gap: 10px;
            overflow-x: auto;
            padding: 8px 2px;
            cursor: grab;
            user-select: none;
            -webkit-overflow-scrolling: touch;
        }
        .event-scroll-wrap:active { cursor: grabbing; }
        .event-scroll-wrap::-webkit-scrollbar { height: 6px; }
        .event-scroll-wrap::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .event-scroll-wrap::-webkit-scrollbar-track { background: var(--bg); }

        .event-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .event-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .event-card:active { transform: scale(0.96); }
        .event-card .emoji { font-size: 1.3rem; }
        .event-card .name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .btn-modal {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-modal-cancel {
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-modal-cancel:hover { background: var(--border); color: var(--text); }
        .btn-modal-confirm {
            background: var(--green);
            color: #fff;
        }
        .btn-modal-confirm:hover { background: var(--green-hover); }

        /* 内置 Toast 消息 */
        #toast {
            visibility: hidden;
            opacity: 0;
            background: var(--green);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 640px) {
            body { padding: 0.75rem 0.5rem 1.5rem; }
            h1 { font-size: 1.35rem; margin-bottom: 1rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat-val { font-size: 1.35rem; }
            .graph-card { padding: 0.85rem; }
            #heatmap { height: 140px; }
            .source-tabs { gap: 0.35rem; padding: 0.5rem; }
            .source-tab { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>热力图</h1>

    <!-- 来源 Tab -->
    <div class="source-tabs" id="sourceTabs"></div>

    <!-- 统计 -->
    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">总计</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statToday">0</div>
            <div class="stat-lbl">今日</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statStreak">0</div>
            <div class="stat-lbl">连续</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statSources">0</div>
            <div class="stat-lbl">事件</div>
        </div>
    </div>

    <!-- 单张热力图 -->
    <div class="graph-card">
        <div class="graph-header">
            <div class="graph-title">
                <span>活动</span>
                <span class="badge" id="currentBadge">
                    <span class="dot" id="badgeDot"></span>
                    <span id="badgeName">全部</span>
                </span>
                <!-- 常驻记录按钮 -->
                <button class="record-btn" id="recordBtn" onclick="handleRecordClick()">+ 记录</button>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <select id="combineMode" style="display:none;" title="合并方式">
                    <option value="winner">热度</option>
                    <option value="blend">混合</option>
                    <option value="stack">总计</option>
                </select>
                <select id="year"></select>
            </div>
        </div>
        <div class="heatmap-wrap">
            <div id="heatmap"></div>
        </div>
        <div class="legend" id="legend"></div>
    </div>

    <footer>
        <a href="/mobile.html">事件</a>
    </footer>
</div>

<!-- 自定义弹窗 1：选择事件弹窗 (两排左右滑动/拖拽) -->
<div class="modal-overlay" id="selectModal">
    <div class="custom-modal">
        <div class="modal-header">
            <div class="modal-title">选择要记录的事件</div>
            <button class="modal-close" onclick="closeSelectModal()">×</button>
        </div>
        <div class="event-scroll-wrap" id="eventScrollContainer"></div>
    </div>
</div>

<!-- 自定义弹窗 2：二次确认框 -->
<div class="modal-overlay" id="confirmModal">
    <div class="custom-modal" style="max-width: 360px;">
        <div class="modal-title" style="margin-bottom:10px;">确认打卡</div>
        <p style="color:var(--muted);font-size:0.95rem;margin-bottom:20px;">
            确定要为「<strong id="targetEventName" style="color:var(--text)"></strong>」记录一次打卡吗？
        </p>
        <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeConfirmModal()">取消</button>
            <button class="btn-modal btn-modal-confirm" onclick="submitLog()">确定</button>
        </div>
    </div>
</div>

<!-- 自定义内置 Toast 提示框 -->
<div id="toast">✅ 记录成功！</div>

<script>
const DEFAULT_PRESETS = {
    'default': { rgb: '139,148,158', hex: '#8b949e', name: '其他', is_low_freq: false }
};

let sourceColors = { ...DEFAULT_PRESETS };

function hexToRgb(hex) {
    if (!hex || !hex.startsWith('#')) return '139,148,158';
    const n = parseInt(hex.slice(1), 16);
    if (isNaN(n)) return '139,148,158';
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

async function loadSourceColorsFromDB() {
    const map = { ...DEFAULT_PRESETS };
    try {
        const res = await fetch('/api/sources');
        if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list)) {
                list.forEach(e => {
                    if (!e.id) return;
                    map[e.id] = {
                        rgb: hexToRgb(e.color),
                        hex: e.color || '#8b949e',
                        name: e.name || e.id,
                        emoji: e.emoji || '📱',
                        is_low_freq: !!e.is_low_freq
                    };
                });
            }
        }
    } catch (e) {
        console.warn('Failed to load sources from database');
    }
    sourceColors = map;
}

function getColor(id) {
    if (!sourceColors[id]) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
            hash = id.charCodeAt(i) + ((hash << 5) - hash);
        }
        const c = Math.abs(hash).toString(16);
        const hex = '#' + '000000'.substring(0, 6 - c.length) + c;
        sourceColors[id] = {
            rgb: hexToRgb(hex),
            hex: hex,
            name: id,
            emoji: '📱',
            is_low_freq: false
        };
    }
    return sourceColors[id];
}

/* ========== 状态 ========== */
let year = parseInt(localStorage.getItem('dashboard_year')) || new Date().getFullYear();
let currentSource = localStorage.getItem('dashboard_source') || 'combined';
let combineMode = localStorage.getItem('dashboard_combine_mode') || 'winner';
let pendingTargetSource = null;
let allData = [];
let statsData = {};
let chart = null;

/* ========== 初始化 ========== */
async function init() {
    await loadSourceColorsFromDB();

    const yearSel = document.getElementById('year');
    const cy = new Date().getFullYear();
    for (let y = cy; y >= cy - 5; y--) {
        yearSel.innerHTML += `<option value="${y}" ${y===year?'selected':''}>${y}</option>`;
    }
    yearSel.onchange = async () => {
        year = parseInt(yearSel.value);
        localStorage.setItem('dashboard_year', year);
        await loadData();
        render();
    };

    const modeSel = document.getElementById('combineMode');
    modeSel.value = combineMode;
    modeSel.onchange = () => {
        combineMode = modeSel.value;
        localStorage.setItem('dashboard_combine_mode', combineMode);
        renderHeatmap();
    };

    initMouseDragScroll();

    await loadStats();
    await loadData();
    render();

    setInterval(async () => {
        await loadSourceColorsFromDB();
        await loadStats();
        await loadData();
        render();
    }, 30000);
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        statsData = await res.json();
    } catch (_) {
        statsData = {};
    }
}

async function loadData() {
    try {
        const res = await fetch(`/api/contributions?year=${year}`);
        allData = await res.json() || [];
    } catch (_) {
        allData = [];
    }
}

/* ========== 点击记录处理按钮 ========== */
function handleRecordClick() {
    if (currentSource === 'combined') {
        openSelectEventModal();
    } else {
        promptConfirmLog(currentSource);
    }
}

function openSelectEventModal() {
    const container = document.getElementById('eventScrollContainer');
    let html = '';

    const keys = Object.keys(sourceColors).filter(k => k !== 'default');
    
    if (keys.length === 0) {
        container.innerHTML = '<div style="color:var(--muted);padding:10px;">暂无可用事件，请先在事件页面配置。</div>';
    } else {
        keys.forEach(id => {
            const info = getColor(id);
            html += `
                <div class="event-card" onclick="promptConfirmLog('${id}')">
                    <span class="emoji">${info.emoji || '📱'}</span>
                    <span class="name">${info.name}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    document.getElementById('selectModal').classList.add('show');
}

function closeSelectModal() {
    document.getElementById('selectModal').classList.remove('show');
}

function promptConfirmLog(sourceId) {
    pendingTargetSource = sourceId;
    const info = getColor(sourceId);
    document.getElementById('targetEventName').textContent = info.name || sourceId;
    
    closeSelectModal();
    document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('show');
    pendingTargetSource = null;
}

async function submitLog() {
    if (!pendingTargetSource) return;
    const target = pendingTargetSource;
    closeConfirmModal();

    try {
        const res = await fetch('/api/contributions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([{
                source: target,
                context: 'manual',
                timestamp: new Date().toISOString(),
                metadata: { device: 'web', manual: true }
            }])
        });

        if (res.ok) {
            showToast('✅ 记录成功！');
            await loadStats();
            await loadData();
            render();
        } else {
            showToast('❌ 记录失败，请重试');
        }
    } catch (e) {
        showToast('❌ 网络请求失败');
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}

function initMouseDragScroll() {
    const el = document.getElementById('eventScrollContainer');
    let isDown = false;
    let startX, scrollLeft;

    el.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
    });
    el.addEventListener('mouseleave', () => { isDown = false; });
    el.addEventListener('mouseup', () => { isDown = false; });
    el.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.5;
        el.scrollLeft = scrollLeft - walk;
    });
}

/* ========== 渲染 ========== */
function render() {
    renderTabs();
    renderStats();
    renderHeatmap();
}

function renderTabs() {
    // 恢复原有逻辑：仅统计在当前年份有数据记录的事件
    const bySource = {};
    allData.forEach(c => {
        bySource[c.source] = (bySource[c.source] || 0) + 1;
    });

    if (currentSource !== 'combined' && !bySource[currentSource]) {
        currentSource = 'combined';
        localStorage.setItem('dashboard_source', 'combined');
    }

    const tabs = document.getElementById('sourceTabs');
    let html = '';

    const total = allData.length;
    html += tabHtml('combined', '全部', total, 'linear-gradient(135deg,#238636,#3b82f6)');

    Object.entries(bySource)
        .sort((a, b) => b[1] - a[1])
        .forEach(([id, cnt]) => {
            const c = getColor(id);
            html += tabHtml(id, c.name, cnt, c.hex);
        });

    tabs.innerHTML = html;

    tabs.querySelectorAll('.source-tab').forEach(el => {
        el.onclick = () => {
            currentSource = el.dataset.id;
            localStorage.setItem('dashboard_source', currentSource);
            render();
        };
    });
}

function tabHtml(id, name, count, color) {
    const active = currentSource === id ? 'active' : '';
    return `<button class="source-tab ${active}" data-id="${id}">
        <span class="dot" style="background:${color}"></span>
        ${name}
        <span class="count">${count}</span>
    </button>`;
}

function renderStats() {
    const bySource = statsData.by_source || {};

    const now = new Date();
    const todayStr = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0')
    ].join('-');

    let total, today;
    if (currentSource === 'combined') {
        total = allData.length;
        today = allData.filter(c => {
            const t = c.timestamp || '';
            const d = t.slice(0, 10);
            return d === todayStr;
        }).length;
    } else {
        const filtered = allData.filter(c => c.source === currentSource);
        total = filtered.length;
        today = filtered.filter(c => (c.timestamp || '').slice(0, 10) === todayStr).length;
    }

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statStreak').textContent = statsData.current_streak || 0;
    document.getElementById('statSources').textContent = Object.keys(bySource).length;
}

function renderHeatmap() {
    const isCombined = currentSource === 'combined';
    
    const modeSel = document.getElementById('combineMode');
    modeSel.style.display = isCombined ? '' : 'none';

    const c = isCombined
        ? { hex: 'linear-gradient(135deg,#238636,#3b82f6)', name: '全部' }
        : getColor(currentSource);
    document.getElementById('badgeDot').style.background = typeof c.hex === 'string' && c.hex.startsWith('#') ? c.hex : '#238636';
    document.getElementById('badgeName').textContent = c.name || currentSource;

    const data = isCombined ? allData : allData.filter(x => x.source === currentSource);

    const days = {};
    data.forEach(item => {
        const dt = (item.timestamp || '').split('T')[0];
        if (!dt) return;
        if (!days[dt]) days[dt] = { total: 0, src: {} };
        days[dt].total++;
        days[dt].src[item.source] = (days[dt].src[item.source] || 0) + 1;
    });

    const chartData = Object.entries(days).map(([date, stats]) => {
        let color;
        if (isCombined) {
            color = getCombinedColor(stats);
        } else {
            const sc = getColor(currentSource);
            let opacity;
            if (sc.is_low_freq) {
                opacity = Math.min(1, 0.65 + (stats.total - 1) * 0.12);
            } else {
                opacity = Math.min(1, Math.max(0.3, stats.total / 10));
            }
            color = `rgba(${sc.rgb},${opacity})`;
        }
        return {
            value: [date, stats.total],
            itemStyle: {
                color,
                borderColor: '#0d1117',
                borderWidth: 1,
                borderRadius: 2
            }
        };
    });

    const legendColor = isCombined ? { rgb: '35,134,54', hex: '#238636' } : getColor(currentSource);
    document.getElementById('legend').innerHTML = `
        <div class="legend-item"><div class="legend-box" style="background:#161b22"></div>无</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.35)"></div>少</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.65)"></div>中</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.85)"></div>较多</div>
        <div class="legend-item"><div class="legend-box" style="background:${legendColor.hex}"></div>多</div>
    `;

    const el = document.getElementById('heatmap');
    const wrap = el.parentElement;
    const avail = wrap.clientWidth || 800;
    const isMobile = window.innerWidth < 640;
    const cell = isMobile ? Math.max(9, Math.floor((avail - 30) / 53)) : Math.min(14, Math.floor((avail - 50) / 53));
    const leftPad = isMobile ? 22 : 36;
    const rightPad = isMobile ? 4 : 16;
    const graphW = 53 * cell + leftPad + rightPad;
    el.style.width = graphW + 'px';
    el.style.height = (isMobile ? 130 : 170) + 'px';

    if (chart) chart.dispose();
    chart = echarts.init(el, 'dark');

    chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
            appendToBody: true,
            confine: false,
            extraCssText: 'z-index: 9999; pointer-events: none;',
            position: function (point, params, dom, rect, size) {
                const x = point[0];
                const y = point[1] - size.contentSize[1] - 12;
                return [x, Math.max(8, y)];
            },
            formatter: p => {
                if (!p.data || !p.data.value) return '';
                const date = p.data.value[0];
                const count = p.data.value[1];
                const dayStats = days[date];
                let tip = `<b>${date}</b><br/>${count} 次`;
                if (isCombined && dayStats) {
                    tip += '<br/>';
                    Object.entries(dayStats.src)
                        .sort((a, b) => b[1] - a[1])
                        .forEach(([src, cnt]) => {
                            const info = getColor(src);
                            tip += `<br/><span style="color:${info.hex}">●</span> ${info.name}：${cnt}`;
                        });
                }
                return tip;
            }
        },
        calendar: {
            top: 20,
            left: leftPad,
            right: rightPad,
            cellSize: [cell, cell],
            range: year.toString(),
            itemStyle: { color: '#161b22', borderColor: '#0d1117', borderWidth: 1 },
            splitLine: { show: false },
            yearLabel: { show: false },
            dayLabel: {
                color: '#8b949e',
                firstDay: 1,
                nameMap: ['7', '1', '2', '3', '4', '5', '6']
            },
            monthLabel: { color: '#8b949e', fontSize: isMobile ? 10 : 12 }
        },
        series: {
            type: 'heatmap',
            coordinateSystem: 'calendar',
            data: chartData
        }
    });
}

function getCombinedColor(stats) {
    const sources = Object.entries(stats.src);
    if (combineMode === 'winner') {
        let winner = 'default', max = 0;
        sources.forEach(([src, cnt]) => { if (cnt > max) { max = cnt; winner = src; } });
        const sc = getColor(winner);
        let opacity;
        if (sc.is_low_freq) {
            opacity = Math.min(1, 0.65 + (stats.total - 1) * 0.12);
        } else {
            opacity = Math.min(1, Math.max(0.3, stats.total / 12));
        }
        return `rgba(${sc.rgb},${opacity})`;
    }
    if (combineMode === 'blend') {
        let r = 0, g = 0, b = 0;
        sources.forEach(([src, cnt]) => {
            const rgb = getColor(src).rgb.split(',').map(Number);
            const w = cnt / stats.total;
            r += rgb[0] * w; g += rgb[1] * w; b += rgb[2] * w;
        });
        const opacity = Math.min(1, Math.max(0.3, stats.total / 12));
        return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${opacity})`;
    }
    const sc = { rgb: '35,134,54', hex: '#238636' };
    const opacity = Math.min(1, Math.max(0.3, stats.total / 18));
    return `rgba(${sc.rgb},${opacity})`;
}

window.addEventListener('resize', () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => { if (allData) renderHeatmap(); }, 200);
});

init();
</script>
</body>
