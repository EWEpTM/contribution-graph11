<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="个人活动打卡与热力图">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Keep">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <title>Keep</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --green-hover: #2ea043;
            --blue: #3b82f6;
            --orange: #f97316;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --page-pad-x: clamp(0.5rem, 2vw, 2rem);
            --page-pad-y: clamp(0.6rem, 1.5vw, 2.5rem);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100%;
            min-height: 100dvh;
            padding: var(--page-pad-y) var(--page-pad-x) calc(var(--page-pad-y) + var(--safe-bottom));
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: clamp(0.65rem, 1.5vw, 1.25rem);
        }
        h1 {
            text-align: center;
            font-size: clamp(1.25rem, 2.5vw + 0.6rem, 2.2rem);
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #238636, #58a6ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
        }
        .source-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(0.3rem, 0.8vw, 0.5rem);
            justify-content: center;
            padding: clamp(0.45rem, 1.2vw, 0.75rem);
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            flex-shrink: 0;
        }
        .source-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: clamp(0.28rem, 0.8vw, 0.45rem) clamp(0.55rem, 1.5vw, 0.95rem);
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .source-tab:hover { color: var(--text); background: var(--bg3); }
        .source-tab.active {
            background: var(--bg3);
            color: var(--text);
            border-color: var(--border);
        }
        .source-tab .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .source-tab .count {
            background: var(--bg);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-size: 0.72em;
            color: var(--muted);
        }
        .source-tab.active .count { color: var(--text); }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(0.4rem, 1.2vw, 1.25rem);
            flex-shrink: 0;
        }
        .stat {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: clamp(0.65rem, 1.5vw, 1.3rem) clamp(0.4rem, 1vw, 1rem);
            text-align: center;
            min-width: 0;
        }
        .stat-val {
            font-size: clamp(1.15rem, 2.5vw + 0.4rem, 2.2rem);
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-lbl {
            font-size: clamp(0.62rem, 1.1vw, 0.8rem);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.2rem;
        }
        .graph-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(0.7rem, 1.8vw, 1.75rem);
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
        }
        .graph-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(0.5rem, 1.2vw, 1rem);
            flex-wrap: wrap;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .graph-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            font-weight: 600;
            flex-wrap: wrap;
        }
        .graph-title .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.55rem;
            background: var(--bg3);
            border-radius: 16px;
            font-size: 0.8em;
            font-weight: 500;
        }
        .graph-title .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
        .record-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: clamp(0.3rem, 0.8vw, 0.45rem) clamp(0.75rem, 1.8vw, 1.1rem);
            border-radius: 16px;
            font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 2px 6px rgba(35,134,54,0.3);
        }
        .record-btn:hover { background: var(--green-hover); transform: translateY(-1px); }
        .record-btn:active { transform: scale(0.95); }
        select {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.35rem 0.55rem;
            font-size: clamp(0.8rem, 1.4vw, 0.9rem);
            cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--green); }
        .heatmap-wrap {
            position: relative;
            z-index: 1;
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 auto;
            min-height: 0;
            padding-bottom: 2px;
        }
        #heatmap {
            min-width: 0;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: clamp(0.6rem, 1.5vw, 1rem);
            margin-top: clamp(0.45rem, 1vw, 0.85rem);
            font-size: clamp(0.68rem, 1.2vw, 0.75rem);
            color: var(--muted);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .legend-item { display: flex; align-items: center; gap: 0.28rem; }
        .legend-box { width: 11px; height: 11px; border-radius: 2px; }
        footer {
            text-align: center;
            font-size: clamp(0.8rem, 1.4vw, 0.9rem);
            color: var(--muted);
            flex-shrink: 0;
            padding-top: 0.15rem;
        }
        footer a { color: #58a6ff; text-decoration: none; }
        footer a:hover { color: var(--text); }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .custom-modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(14px, 3vw, 20px);
            width: 100%;
            max-width: min(420px, 94vw);
            max-height: min(90dvh, 90vh);
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-close:hover { color: var(--text); }
        .event-scroll-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(6px, 1.5vw, 10px);
            max-height: min(380px, 50dvh);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 2px;
            user-select: none;
            -webkit-overflow-scrolling: touch;
        }
        .event-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            text-align: center;
        }
        .event-card:hover { border-color: #58a6ff; transform: translateY(-2px); }
        .event-card:active { transform: scale(0.95); }
        .event-card .emoji { font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1; }
.event-card .name {
    font-size: clamp(0.7rem, 1.8vw, 0.8rem);
    font-weight: 500;
    color: var(--text);
    width: 100%;
    padding: 0 2px;
    text-align: center;
    line-height: 1.25;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .btn-modal {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-modal-cancel {
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-modal-confirm { background: var(--green); color: #fff; }
        #toast {
            visibility: hidden;
            opacity: 0;
            background: var(--green);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: opacity 0.3s, visibility 0.3s;
            max-width: 90vw;
            text-align: center;
        }
        #toast.show { visibility: visible; opacity: 1; }
        @media (max-width: 640px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .container { gap: 0.4rem; }
            .stats { grid-template-columns: repeat(4, 1fr); }
            .stat { padding: 0.4rem 0.3rem; }
            .stat-val { font-size: 1.1rem; }
            h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Keep 热力图</h1>
    <div class="source-tabs" id="sourceTabs"></div>
    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">总计</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statToday">0</div>
            <div class="stat-lbl">今日</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statStreak">0</div>
            <div class="stat-lbl">连续</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statSources">0</div>
            <div class="stat-lbl">事件类</div>
        </div>
    </div>
    <div class="graph-card">
        <div class="graph-header">
            <div class="graph-title">
                <span>活动</span>
                <span class="badge" id="currentBadge">
                    <span class="dot" id="badgeDot"></span>
                    <span id="badgeName">全部</span>
                </span>
                <button class="record-btn" id="recordBtn" onclick="handleRecordClick()">+ 记录</button>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <select id="combineMode" style="display:none;" title="合并方式">
                    <option value="winner">热度</option>
                    <option value="blend">混合</option>
                    <option value="stack">总计</option>
                </select>
                <select id="year"></select>
            </div>
        </div>
        <div class="heatmap-wrap">
            <div id="heatmap"></div>
        </div>
        <div class="legend" id="legend"></div>
    </div>
    <footer>
        <a href="/manage.html">⚙️ 事件类型配置</a>
    </footer>
</div>

<div class="modal-overlay" id="selectModal">
    <div class="custom-modal">
        <div class="modal-header">
            <div class="modal-title">选择要记录的事件</div>
            <button class="modal-close" onclick="closeSelectModal()">×</button>
        </div>
        <div class="event-scroll-wrap" id="eventScrollContainer"></div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="custom-modal" style="max-width: 360px;">
        <div class="modal-title" style="margin-bottom:10px;">确认打卡</div>
        <p style="color:var(--muted);font-size:0.95rem;margin-bottom:20px;">
            确定要为「<strong id="targetEventName" style="color:var(--text)"></strong>」记录一次打卡吗？
        </p>
        <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeConfirmModal()">取消</button>
            <button class="btn-modal btn-modal-confirm" onclick="submitLog()">确定</button>
        </div>
    </div>
</div>

<div id="toast">✅ 记录成功！</div>

<script>
const DEFAULT_PRESETS = {
    'default': { rgb: '139,148,158', hex: '#8b949e', name: '其他', is_low_freq: false }
};
let sourceColors = { ...DEFAULT_PRESETS };

function hexToRgb(hex) {
    if (!hex || !hex.startsWith('#')) return '139,148,158';
    const n = parseInt(hex.slice(1), 16);
    if (isNaN(n)) return '139,148,158';
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

async function loadSourceColorsFromDB() {
    const map = { ...DEFAULT_PRESETS };
    try {
        const res = await fetch('/api/sources');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list)) {
                list.forEach(e => {
                    if (!e.id) return;
                    map[e.id] = {
                        rgb: hexToRgb(e.color),
                        hex: e.color || '#8b949e',
                        name: e.name || e.id,
                        emoji: e.emoji || '📱',
                        is_low_freq: !!e.is_low_freq
                    };
                });
            }
        }
    } catch (e) {
        console.warn('Failed to load sources from database');
    }
    sourceColors = map;
}

function getColor(id) {
    if (!sourceColors[id]) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
            hash = id.charCodeAt(i) + ((hash << 5) - hash);
        }
        const c = Math.abs(hash).toString(16);
        const hex = '#' + '000000'.substring(0, 6 - c.length) + c;
        sourceColors[id] = {
            rgb: hexToRgb(hex),
            hex: hex,
            name: id,
            emoji: '📱',
            is_low_freq: false
        };
    }
    return sourceColors[id];
}

let year = parseInt(localStorage.getItem('dashboard_year')) || new Date().getFullYear();
let currentSource = localStorage.getItem('dashboard_source') || 'combined';
let combineMode = localStorage.getItem('dashboard_combine_mode') || 'winner';
let pendingTargetSource = null;
let allData = [];
let statsData = {};
let chart = null;

function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

async function init() {
    await loadSourceColorsFromDB();
    const yearSel = document.getElementById('year');
    const cy = new Date().getFullYear();
    yearSel.innerHTML = '';
    for (let y = cy; y >= cy - 5; y--) {
        yearSel.innerHTML += `<option value="${y}" ${y===year?'selected':''}>${y}</option>`;
    }
    yearSel.onchange = async () => {
        year = parseInt(yearSel.value);
        localStorage.setItem('dashboard_year', year);
        await loadData();
        render();
    };
    const modeSel = document.getElementById('combineMode');
    modeSel.value = combineMode;
    modeSel.onchange = () => {
        combineMode = modeSel.value;
        localStorage.setItem('dashboard_combine_mode', combineMode);
        renderHeatmap();
    };
    await loadStats();
    await loadData();
    render();
    setInterval(async () => {
        await loadSourceColorsFromDB();
        await loadStats();
        await loadData();
        render();
    }, 30000);
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        statsData = await res.json();
    } catch (_) {
        statsData = {};
    }
}

async function loadData() {
    try {
        const res = await fetch(`/api/contributions?year=${year}`);
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        allData = await res.json() || [];
    } catch (_) {
        allData = [];
    }
}

function handleRecordClick() {
    if (currentSource === 'combined') openSelectEventModal();
    else promptConfirmLog(currentSource);
}

function openSelectEventModal() {
    const container = document.getElementById('eventScrollContainer');
    const keys = Object.keys(sourceColors).filter(k => k !== 'default');
    if (keys.length === 0) {
        container.innerHTML = '<div style="color:var(--muted);padding:20px;grid-column:span 3;text-align:center;">暂无可用事件，请先在事件配置页面添加。</div>';
    } else {
        let html = '';
        keys.forEach(id => {
            const info = getColor(id);
html += `<div class="event-card" onclick="promptConfirmLog('${id}')">
    <span class="emoji">${info.emoji || '📱'}</span>
    <span class="name">${(info.name || id).slice(0, 16)}</span>
</div>`;
        });
        container.innerHTML = html;
    }
    document.getElementById('selectModal').classList.add('show');
}

function closeSelectModal() {
    document.getElementById('selectModal').classList.remove('show');
}

function promptConfirmLog(sourceId) {
    pendingTargetSource = sourceId;
    const info = getColor(sourceId);
    document.getElementById('targetEventName').textContent = info.name || sourceId;
    closeSelectModal();
    document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('show');
    pendingTargetSource = null;
}

async function submitLog() {
    if (!pendingTargetSource) return;
    const target = pendingTargetSource;
    closeConfirmModal();
    try {
        const res = await fetch('/api/contributions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([{
                source: target,
                context: 'manual',
                timestamp: new Date().toISOString(),
                metadata: { device: 'web', manual: true }
            }])
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
            showToast('✅ 记录成功！');
            await loadStats();
            await loadData();
            render();
        } else showToast('❌ 记录失败，请重试');
    } catch (e) {
        showToast('❌ 网络请求失败');
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function render() {
    renderTabs();
    renderStats();
    renderHeatmap();
}

function renderTabs() {
    const bySource = {};
    allData.forEach(c => { bySource[c.source] = (bySource[c.source] || 0) + 1; });
    if (currentSource !== 'combined' && !bySource[currentSource]) {
        currentSource = 'combined';
        localStorage.setItem('dashboard_source', 'combined');
    }
    const tabs = document.getElementById('sourceTabs');
    let html = tabHtml('combined', '全部', allData.length, 'linear-gradient(135deg,#238636,#3b82f6)');
    Object.entries(bySource).sort((a, b) => b[1] - a[1]).forEach(([id, cnt]) => {
        const c = getColor(id);
        html += tabHtml(id, c.name, cnt, c.hex);
    });
    tabs.innerHTML = html;
    tabs.querySelectorAll('.source-tab').forEach(el => {
        el.onclick = () => {
            currentSource = el.dataset.id;
            localStorage.setItem('dashboard_source', currentSource);
            render();
        };
    });
}

function tabHtml(id, name, count, color) {
    const active = currentSource === id ? 'active' : '';
    return `<button class="source-tab ${active}" data-id="${id}">
        <span class="dot" style="background:${color}"></span>
        ${name}<span class="count">${count}</span>
    </button>`;
}

function renderStats() {
    const bySource = statsData.by_source || {};
    const now = new Date();
    const todayStr = statsData.today_date || [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0')
    ].join('-');
    let total, today;
    if (currentSource === 'combined') {
        total = allData.length;
        today = allData.filter(c => (c.local_date || (c.timestamp || '').slice(0, 10)) === todayStr).length;
    } else {
        const filtered = allData.filter(c => c.source === currentSource);
        total = filtered.length;
        today = filtered.filter(c => (c.local_date || (c.timestamp || '').slice(0, 10)) === todayStr).length;
    }
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statStreak').textContent = statsData.current_streak || 0;
    document.getElementById('statSources').textContent = Object.keys(bySource).length;
}

function renderHeatmap() {
    const isCombined = currentSource === 'combined';
    document.getElementById('combineMode').style.display = isCombined ? '' : 'none';
    const c = isCombined
        ? { hex: 'linear-gradient(135deg,#238636,#3b82f6)', name: '全部' }
        : getColor(currentSource);
    document.getElementById('badgeDot').style.background =
        typeof c.hex === 'string' && c.hex.startsWith('#') ? c.hex : '#238636';
    document.getElementById('badgeName').textContent = c.name || currentSource;

    const data = isCombined ? allData : allData.filter(x => x.source === currentSource);
    const days = {};
    data.forEach(item => {
        const dt = item.local_date || (item.timestamp || '').split('T')[0];
        if (!dt) return;
        if (!days[dt]) days[dt] = { total: 0, src: {} };
        days[dt].total++;
        days[dt].src[item.source] = (days[dt].src[item.source] || 0) + 1;
    });

    const chartData = Object.entries(days).map(([date, stats]) => {
        let color;
        if (isCombined) color = getCombinedColor(stats);
        else {
            const sc = getColor(currentSource);
            let opacity = sc.is_low_freq
                ? Math.min(1, 0.65 + (stats.total - 1) * 0.12)
                : Math.min(1, Math.max(0.3, stats.total / 10));
            color = `rgba(${sc.rgb},${opacity})`;
        }
        return {
            value: [date, stats.total],
            itemStyle: { color, borderColor: '#0d1117', borderWidth: 1, borderRadius: 2 }
        };
    });

    const legendColor = isCombined ? { rgb: '35,134,54', hex: '#238636' } : getColor(currentSource);
    document.getElementById('legend').innerHTML = `
        <div class="legend-item"><div class="legend-box" style="background:#161b22"></div>无</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.35)"></div>少</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.65)"></div>中</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.85)"></div>较多</div>
        <div class="legend-item"><div class="legend-box" style="background:${legendColor.hex}"></div>多</div>
    `;

    const el = document.getElementById('heatmap');
    const wrap = el.parentElement;
    const vw = window.innerWidth || 800;
    const vh = window.innerHeight || 600;
    const isNarrow = vw < 640;
    const isTablet = vw >= 640 && vw < 1024;

    void wrap.offsetWidth;
    let avail = wrap.clientWidth || vw;
    if (avail < 80) avail = vw - 24;

    const leftPad = isNarrow ? 18 : (isTablet ? 28 : 42);
    const rightPad = isNarrow ? 4 : (isTablet ? 12 : 20);
    let cell = Math.floor((avail - leftPad - rightPad) / 53);
    if (isNarrow) cell = Math.max(7, Math.min(14, cell));
    else if (isTablet) cell = Math.max(10, Math.min(18, cell));
    else cell = Math.max(12, Math.min(22, cell));

    const usedOutside =
        (document.querySelector('h1')?.offsetHeight || 40) +
        (document.getElementById('sourceTabs')?.offsetHeight || 48) +
        (document.querySelector('.stats')?.offsetHeight || 80) +
        (document.querySelector('.graph-header')?.offsetHeight || 40) +
        (document.getElementById('legend')?.offsetHeight || 28) +
        (document.querySelector('footer')?.offsetHeight || 28) + 80;

    const maxGraphH = Math.max(110, Math.min(vh - usedOutside, isNarrow ? 160 : (isTablet ? 200 : 240)));
    let graphH = Math.round(cell * 7 + (isNarrow ? 36 : 48));
    if (graphH > maxGraphH) {
        graphH = maxGraphH;
        const cellByH = Math.floor((graphH - (isNarrow ? 36 : 48)) / 7);
        if (cellByH > 0 && cellByH < cell) cell = Math.max(isNarrow ? 7 : 10, cellByH);
    }
    const graphW = 53 * cell + leftPad + rightPad;
    el.style.width = graphW + 'px';
    el.style.height = graphH + 'px';

    const draw = () => {
        if (chart && isIOSDevice()) {
            try { chart.dispose(); } catch (_) {}
            chart = null;
        }
        if (!chart) {
            chart = echarts.init(el, 'dark', { width: graphW, height: graphH, renderer: 'canvas' });
        } else {
            chart.resize({ width: graphW, height: graphH });
        }
        const labelSize = Math.max(9, Math.min(13, Math.floor(cell * 0.7)));
        const monthSize = Math.max(10, Math.min(13, Math.floor(cell * 0.75)));
        chart.setOption({
            backgroundColor: 'transparent',
            animation: false,
            tooltip: {
                appendToBody: true,
                confine: false,
                extraCssText: 'z-index: 9999; pointer-events: none;',
                position: function (point, params, dom, rect, size) {
                    return [point[0], Math.max(8, point[1] - size.contentSize[1] - 12)];
                },
                formatter: p => {
                    if (!p.data || !p.data.value) return '';
                    const date = p.data.value[0];
                    const count = p.data.value[1];
                    const dayStats = days[date];
                    let tip = `<b>${date}</b><br/>${count} 次`;
                    if (isCombined && dayStats) {
                        tip += '<br/>';
                        Object.entries(dayStats.src).sort((a, b) => b[1] - a[1]).forEach(([src, cnt]) => {
                            const info = getColor(src);
                            tip += `<br/><span style="color:${info.hex}">●</span> ${info.name}：${cnt}`;
                        });
                    }
                    return tip;
                }
            },
            calendar: {
                top: isNarrow ? 16 : Math.max(22, cell * 1.2),
                left: leftPad,
                right: rightPad,
                cellSize: [cell, cell],
                range: year.toString(),
                itemStyle: { color: '#161b22', borderColor: '#0d1117', borderWidth: 1 },
                splitLine: { show: false },
                yearLabel: { show: false },
                dayLabel: {
                    color: '#8b949e', firstDay: 1,
                    nameMap: ['7', '1', '2', '3', '4', '5', '6'],
                    fontSize: labelSize
                },
                monthLabel: { color: '#8b949e', fontSize: monthSize }
            },
            series: { type: 'heatmap', coordinateSystem: 'calendar', data: chartData }
        }, true);
        requestAnimationFrame(() => {
            if (chart && !chart.isDisposed()) chart.resize({ width: graphW, height: graphH });
        });
    };
    requestAnimationFrame(draw);
}

function getCombinedColor(stats) {
    const sources = Object.entries(stats.src);
    if (combineMode === 'winner') {
        let winner = 'default', max = 0;
        sources.forEach(([src, cnt]) => { if (cnt > max) { max = cnt; winner = src; } });
        const sc = getColor(winner);
        const opacity = sc.is_low_freq
            ? Math.min(1, 0.65 + (stats.total - 1) * 0.12)
            : Math.min(1, Math.max(0.3, stats.total / 12));
        return `rgba(${sc.rgb},${opacity})`;
    }
    if (combineMode === 'blend') {
        let r = 0, g = 0, b = 0;
        sources.forEach(([src, cnt]) => {
            const rgb = getColor(src).rgb.split(',').map(Number);
            const w = cnt / stats.total;
            r += rgb[0] * w; g += rgb[1] * w; b += rgb[2] * w;
        });
        return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${Math.min(1, Math.max(0.3, stats.total / 12))})`;
    }
    return `rgba(35,134,54,${Math.min(1, Math.max(0.3, stats.total / 18))})`;
}

window.addEventListener('resize', () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => { if (allData) renderHeatmap(); }, 200);
});
window.addEventListener('orientationchange', () => {
    setTimeout(() => { if (allData) renderHeatmap(); }, 300);
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(() => {
            console.log('[PWA] Service Worker registered');
        }).catch((err) => {
            console.error('[PWA] Service Worker registration failed:', err);
        });
    });
}

init();
</script>
