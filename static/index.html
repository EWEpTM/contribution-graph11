<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>贡献热力图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --blue: #3b82f6;
            --orange: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #238636, #58a6ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 来源 Tab */
        .source-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.75rem;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.25rem;
        }
        .source-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .source-tab:hover { color: var(--text); background: var(--bg3); }
        .source-tab.active {
            background: var(--bg3);
            color: var(--text);
            border-color: var(--border);
        }
        .source-tab .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .source-tab .count {
            background: var(--bg);
            padding: 0.1rem 0.45rem;
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .source-tab.active .count { color: var(--text); }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .stat {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 0.75rem;
            text-align: center;
        }
        .stat-val {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-lbl {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.25rem;
        }

        /* 热力图卡片 */
        .graph-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .graph-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .graph-title .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            background: var(--bg3);
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .graph-title .badge .dot {
            width: 8px; height: 8px; border-radius: 50%;
        }
        select {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.65rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--green); }

        /* 日历居中 + 响应式 */
        .heatmap-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            padding-bottom: 4px;
        }
        #heatmap {
            height: 170px;
            min-width: 0;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.85rem;
            font-size: 0.75rem;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .legend-box {
            width: 11px; height: 11px;
            border-radius: 2px;
        }

        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        footer a:hover { color: var(--text); }

        @media (max-width: 640px) {
            body { padding: 0.75rem 0.5rem 1.5rem; }
            h1 { font-size: 1.35rem; margin-bottom: 1rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat-val { font-size: 1.35rem; }
            .graph-card { padding: 0.85rem; }
            #heatmap { height: 140px; }
            .source-tabs { gap: 0.35rem; padding: 0.5rem; }
            .source-tab { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>开放贡献热力图</h1>

    <!-- 来源 Tab -->
    <div class="source-tabs" id="sourceTabs"></div>

    <!-- 统计 -->
    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">总计</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statToday">0</div>
            <div class="stat-lbl">今日</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statStreak">0</div>
            <div class="stat-lbl">🔥 连续</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statSources">0</div>
            <div class="stat-lbl">来源数</div>
        </div>
    </div>

    <!-- 单张热力图 -->
    <div class="graph-card">
        <div class="graph-header">
            <div class="graph-title">
                <span>活动</span>
                <span class="badge" id="currentBadge">
                    <span class="dot" id="badgeDot"></span>
                    <span id="badgeName">全部</span>
                </span>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <select id="combineMode" style="display:none;" title="合并方式">
                    <option value="winner">主导来源</option>
                    <option value="blend">颜色混合</option>
                    <option value="stack">叠加总量</option>
                </select>
                <select id="year"></select>
            </div>
        </div>
        <div class="heatmap-wrap">
            <div id="heatmap"></div>
        </div>
        <div class="legend" id="legend"></div>
    </div>

    <footer>
        <a href="/mobile.html">📱 手机打卡</a> ·
        <a href="https://github.com/EWEpTM/contribution-graph11">GitHub</a>
    </footer>
</div>

<script>
/* ========== 颜色与名称 ========== */
const PRESETS = {
    'git':            { rgb: '35,134,54',  hex: '#238636', name: 'Git 提交' },
    'github-import':  { rgb: '35,134,54',  hex: '#238636', name: 'GitHub' },
    'gitlab-import':  { rgb: '59,130,246', hex: '#3B82F6', name: 'GitLab' },
    'coffee':         { rgb: '139,69,19',  hex: '#8B4513', name: '喝咖啡' },
    'fitness':        { rgb: '249,115,22', hex: '#f97316', name: '运动' },
    'reading':        { rgb: '234,179,8',  hex: '#eab308', name: '阅读' },
    'meditation':     { rgb: '168,85,247', hex: '#a855f7', name: '冥想' },
    'learning':       { rgb: '236,72,153', hex: '#ec4899', name: '学习' },
    'default':        { rgb: '139,148,158',hex: '#8b949e', name: '其他' }
};

function hexToRgb(hex) {
    if (!hex || !hex.startsWith('#')) return '139,148,158';
    const n = parseInt(hex.slice(1), 16);
    if (isNaN(n)) return '139,148,158';
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

/** 合并预设 + 手机端 localStorage 自定义事件 */
function loadSourceColors() {
    const map = { ...PRESETS };
    try {
        const saved = localStorage.getItem('loggerEvents');
        if (saved) {
            JSON.parse(saved).forEach(e => {
                if (!e.id) return;
                map[e.id] = {
                    rgb: hexToRgb(e.color),
                    hex: e.color || '#8b949e',
                    name: e.name || e.id
                };
            });
        }
    } catch (_) {}
    return map;
}

let sourceColors = loadSourceColors();

function getColor(id) {
    return sourceColors[id] || sourceColors.default;
}

/* ========== 状态 ========== */
let year = parseInt(localStorage.getItem('dashboard_year')) || new Date().getFullYear();
let currentSource = localStorage.getItem('dashboard_source') || 'combined';
let combineMode = localStorage.getItem('dashboard_combine_mode') || 'winner';
let allData = [];
let statsData = {};
let chart = null;

/* ========== 初始化 ========== */
async function init() {
    // 年份
    const yearSel = document.getElementById('year');
    const cy = new Date().getFullYear();
    for (let y = cy; y >= cy - 5; y--) {
        yearSel.innerHTML += `<option value="${y}" ${y===year?'selected':''}>${y}</option>`;
    }
    yearSel.onchange = async () => {
        year = parseInt(yearSel.value);
        localStorage.setItem('dashboard_year', year);
        await loadData();
        render();
    };

    // 合并模式
    const modeSel = document.getElementById('combineMode');
    modeSel.value = combineMode;
    modeSel.onchange = () => {
        combineMode = modeSel.value;
        localStorage.setItem('dashboard_combine_mode', combineMode);
        renderHeatmap();
    };

    await loadStats();
    await loadData();
    render();

    // 定时刷新
    setInterval(async () => {
        sourceColors = loadSourceColors();
        await loadStats();
        await loadData();
        render();
    }, 30000);
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        statsData = await res.json();
    } catch (_) {
        statsData = {};
    }
}

async function loadData() {
    try {
        const res = await fetch(`/api/contributions?year=${year}`);
        allData = await res.json() || [];
    } catch (_) {
        allData = [];
    }
}

/* ========== 渲染 ========== */
function render() {
    sourceColors = loadSourceColors();
    renderTabs();
    renderStats();
    renderHeatmap();
}

function renderTabs() {
    const bySource = {};
    allData.forEach(c => {
        bySource[c.source] = (bySource[c.source] || 0) + 1;
    });

    // 若当前选中的 source 已不存在，回到 combined
    if (currentSource !== 'combined' && !bySource[currentSource]) {
        currentSource = 'combined';
        localStorage.setItem('dashboard_source', 'combined');
    }

    const tabs = document.getElementById('sourceTabs');
    let html = '';

    // Combined
    const total = allData.length;
    html += tabHtml('combined', '全部', total, 'linear-gradient(135deg,#238636,#3b82f6)');

    // 各来源（按数量排序）
    Object.entries(bySource)
        .sort((a, b) => b[1] - a[1])
        .forEach(([id, cnt]) => {
            const c = getColor(id);
            html += tabHtml(id, c.name, cnt, c.hex);
        });

    tabs.innerHTML = html;

    // 绑定点击
    tabs.querySelectorAll('.source-tab').forEach(el => {
        el.onclick = () => {
            currentSource = el.dataset.id;
            localStorage.setItem('dashboard_source', currentSource);
            render();
        };
    });
}

function tabHtml(id, name, count, color) {
    const active = currentSource === id ? 'active' : '';
    return `<button class="source-tab ${active}" data-id="${id}">
        <span class="dot" style="background:${color}"></span>
        ${name}
        <span class="count">${count}</span>
    </button>`;
}

function renderStats() {
    const bySource = statsData.by_source || {};
    // 当前选中来源的统计
    let total, today;
    if (currentSource === 'combined') {
        total = statsData.total || allData.length;
        today = statsData.today || 0;
    } else {
        total = bySource[currentSource] || allData.filter(c => c.source === currentSource).length;
        // 今日该来源
        const todayStr = new Date().toISOString().slice(0, 10);
        today = allData.filter(c => c.source === currentSource && (c.timestamp || '').startsWith(todayStr)).length;
    }

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statStreak').textContent = statsData.current_streak || 0;
    document.getElementById('statSources').textContent = Object.keys(bySource).length;
}

function renderHeatmap() {
    const isCombined = currentSource === 'combined';
    const modeSel = document.getElementById('combineMode');
    modeSel.style.display = isCombined ? '' : 'none';

    // 标题徽章
    const c = isCombined
        ? { hex: 'linear-gradient(135deg,#238636,#3b82f6)', name: '全部' }
        : getColor(currentSource);
    document.getElementById('badgeDot').style.background = typeof c.hex === 'string' && c.hex.startsWith('#') ? c.hex : '#238636';
    document.getElementById('badgeName').textContent = c.name || currentSource;

    // 过滤数据
    const data = isCombined ? allData : allData.filter(x => x.source === currentSource);

    // 按天聚合
    const days = {};
    data.forEach(item => {
        const dt = (item.timestamp || '').split('T')[0];
        if (!dt) return;
        if (!days[dt]) days[dt] = { total: 0, src: {} };
        days[dt].total++;
        days[dt].src[item.source] = (days[dt].src[item.source] || 0) + 1;
    });

    const chartData = Object.entries(days).map(([date, stats]) => {
        let color;
        if (isCombined) {
            color = getCombinedColor(stats);
        } else {
            const sc = getColor(currentSource);
            const opacity = Math.min(1, Math.max(0.3, stats.total / 10));
            color = `rgba(${sc.rgb},${opacity})`;
        }
        return {
            value: [date, stats.total],
            itemStyle: {
                color,
                borderColor: '#0d1117',
                borderWidth: 1,
                borderRadius: 2
            }
        };
    });

    // 图例
    const legendColor = isCombined ? getColor('git') : getColor(currentSource);
    document.getElementById('legend').innerHTML = `
        <div class="legend-item"><div class="legend-box" style="background:#161b22"></div>无</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.3)"></div>少</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.55)"></div>中</div>
        <div class="legend-item"><div class="legend-box" style="background:rgba(${legendColor.rgb},0.8)"></div>较多</div>
        <div class="legend-item"><div class="legend-box" style="background:${legendColor.hex}"></div>多</div>
    `;

    // 尺寸：根据容器宽度自适应
    const el = document.getElementById('heatmap');
    const wrap = el.parentElement;
    const avail = wrap.clientWidth || 800;
    const isMobile = window.innerWidth < 640;
    const cell = isMobile ? Math.max(9, Math.floor((avail - 30) / 53)) : Math.min(14, Math.floor((avail - 50) / 53));
    const leftPad = isMobile ? 22 : 36;
    const rightPad = isMobile ? 4 : 16;
    const graphW = 53 * cell + leftPad + rightPad;
    el.style.width = graphW + 'px';
    el.style.height = (isMobile ? 130 : 170) + 'px';

    if (chart) chart.dispose();
    chart = echarts.init(el, 'dark');

    chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
            formatter: p => {
                if (!p.data || !p.data.value) return '';
                const date = p.data.value[0];
                const count = p.data.value[1];
                const dayStats = days[date];
                let tip = `<b>${date}</b><br/>${count} 次`;
                if (isCombined && dayStats) {
                    tip += '<br/>';
                    Object.entries(dayStats.src)
                        .sort((a, b) => b[1] - a[1])
                        .forEach(([src, cnt]) => {
                            const info = getColor(src);
                            tip += `<br/><span style="color:${info.hex}">●</span> ${info.name}：${cnt}`;
                        });
                }
                return tip;
            }
        },
        calendar: {
            top: 16,
            left: leftPad,
            right: rightPad,
            cellSize: [cell, cell],
            range: String(year),
            itemStyle: { color: '#161b22', borderColor: '#0d1117', borderWidth: 1 },
            splitLine: { show: false },
            yearLabel: { show: false },
            dayLabel: {
                color: '#8b949e',
                fontSize: isMobile ? 9 : 11,
                nameMap: ['日', '一', '二', '三', '四', '五', '六']
            },
            monthLabel: { color: '#8b949e', fontSize: isMobile ? 9 : 11 }
        },
        series: {
            type: 'heatmap',
            coordinateSystem: 'calendar',
            data: chartData
        }
    });
}

function getCombinedColor(stats) {
    const sources = Object.entries(stats.src);
    if (combineMode === 'winner') {
        let winner = 'default', max = 0;
        sources.forEach(([src, cnt]) => { if (cnt > max) { max = cnt; winner = src; } });
        const sc = getColor(winner);
        const opacity = Math.min(1, Math.max(0.3, stats.total / 12));
        return `rgba(${sc.rgb},${opacity})`;
    }
    if (combineMode === 'blend') {
        let r = 0, g = 0, b = 0;
        sources.forEach(([src, cnt]) => {
            const rgb = getColor(src).rgb.split(',').map(Number);
            const w = cnt / stats.total;
            r += rgb[0] * w; g += rgb[1] * w; b += rgb[2] * w;
        });
        const opacity = Math.min(1, Math.max(0.3, stats.total / 12));
        return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${opacity})`;
    }
    // stack
    const sc = getColor('git');
    const opacity = Math.min(1, Math.max(0.3, stats.total / 18));
    return `rgba(${sc.rgb},${opacity})`;
}

window.addEventListener('resize', () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => { if (allData) renderHeatmap(); }, 200);
});

init();
</script>
</body>
</html>
