<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <title>打卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; color: #e6edf3; }
        .edit-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .edit-btn.active {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            align-content: start;
        }
        .btn {
            border: none;
            border-radius: 16px;
            padding: 24px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn .emoji { font-size: 2rem; }
        .editing .btn:active { transform: none; }
        .add-btn {
            background: #21262d;
            border: 2px dashed #30363d;
            color: #8b949e;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #e6edf3;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .modal input[type="text"]:focus {
            outline: none;
            border-color: #238636;
        }
        .modal input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .modal label {
            display: block;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .hint {
            font-size: 0.75rem;
            color: #6e7681;
            margin: -8px 0 12px;
        }
        .emoji-picker, .color-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        .emoji-option {
            font-size: 1.5rem;
            padding: 8px;
            text-align: center;
            background: #21262d;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
        }
        .emoji-option.selected {
            border-color: #238636;
            background: #238636;
        }

        /* 自定义 Emoji 输入行 */
        .custom-emoji-row {
            margin-bottom: 16px;
        }
        .custom-emoji-row input[type="text"] {
            margin-bottom: 0;
            text-align: center;
            font-size: 1.2rem;
        }

        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-option.selected { border-color: #fff; }

        /* 自定义 HEX 颜色选择器容器 */
        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .custom-color-row input[type="color"] {
            width: 44px;
            height: 44px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            cursor: pointer;
            padding: 2px;
        }
        .custom-color-row input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            font-family: monospace, monospace;
            text-transform: uppercase;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel { background: #21262d; color: #8b949e; }
        .btn-save { background: #238636; color: #fff; }
        .btn-delete {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #f85149;
            border-radius: 8px;
            background: transparent;
            color: #f85149;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-delete:active { background: rgba(248,81,73,0.15); }
        #toast {
            visibility: hidden;
            background: #238636;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 12px 24px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            z-index: 100;
        }
        #toast.show { visibility: visible; animation: fade 2s; }
        @keyframes fade {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 1rem;
            padding: 8px 0;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>记录事件</h1>
        <div style="display:flex;gap:8px;">
            <button class="edit-btn" id="syncBtn" onclick="initData()" title="刷新">↻</button>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()">编辑</button>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer"><a href="/">← 返回仪表盘</a></div>
    <div id="toast">✅ 已记录！</div>

    <!-- 新增 / 编辑弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">添加事件类型</h2>

            <label>名称</label>
            <input type="text" id="eventName" placeholder="例如：跑步">

            <label>来源 ID</label>
            <input type="text" id="eventSource" placeholder="例如：running">
            <p class="hint" id="sourceHint">英文小写，保存后不可修改（对应打卡数据）</p>

            <label>表情 (预设 / 自选 Emoji)</label>
            <div class="emoji-picker" id="emojiPicker"></div>
            <!-- 新增自定义 Emoji 输入框 -->
            <div class="custom-emoji-row">
                <input type="text" id="customEmojiInput" placeholder="直接输入或粘贴任意 Emoji (如 🚴)" oninput="onCustomEmojiInputChange(this.value)">
            </div>

            <label>颜色 (预设 / HEX自选)</label>
            <div class="color-picker" id="colorPicker"></div>
            <div class="custom-color-row">
                <input type="color" id="hexColorPicker" oninput="onCustomColorPickerChange(this.value)">
                <input type="text" id="hexColorInput" placeholder="#238636" maxlength="7" oninput="onCustomHexInputChange(this.value)">
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" id="saveBtn" onclick="saveEvent()">添加</button>
            </div>

            <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="confirmDelete()">删除此事件类型</button>
        </div>
    </div>

<script>
const emojis = ['☕','🏃','📚','🧠','💡','🧘','🎓','💪','🎯','✍️','🎵','🌱','💻','🐙','📱'];
const colors = [
    '#8B4513','#238636','#f97316','#eab308',
    '#3b82f6','#a855f7','#ec4899','#ef4444',
    '#14b8a6','#6366f1','#84cc16','#f59e0b'
];

let eventsList = [];
let isEditing = false;
let selectedEmoji = emojis[0];
let selectedColor = colors[0];
let editingIndex = -1;

async function initData() {
    const btn = document.getElementById('syncBtn');
    if (btn) btn.style.animation = 'spin 1s linear infinite';
    try {
        const res = await fetch('/api/sources');
        if (res.ok) {
            const data = await res.json();
            eventsList = Array.isArray(data) ? data : [];
        }
    } catch (e) {
        eventsList = [];
    } finally {
        if (btn) btn.style.animation = 'none';
        render();
    }
}

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = eventsList.map((e, i) => `
        <button class="btn" style="background:linear-gradient(135deg,${e.color},${adjustColor(e.color,-20)})"
            onclick="${isEditing ? `openEdit(${i})` : `log('${e.id}')`}">
            <span class="emoji">${e.emoji || '📱'}</span>
            ${e.name}
        </button>
    `).join('');

    if (isEditing) {
        grid.innerHTML += `
            <button class="btn add-btn" onclick="openAdd()">
                <span class="emoji">+</span>
                新增
            </button>
        `;
    }
    document.body.classList.toggle('editing', isEditing);
}

function adjustColor(hex, percent) {
    if (!hex || !hex.startsWith('#')) return '#8b949e';
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editBtn');
    btn.classList.toggle('active', isEditing);
    btn.textContent = isEditing ? '完成' : '编辑';
    render();
}

function openAdd() {
    editingIndex = -1;
    document.getElementById('modalTitle').textContent = '添加事件类型';
    document.getElementById('saveBtn').textContent = '添加';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('eventName').value = '';
    document.getElementById('eventSource').value = '';
    document.getElementById('eventSource').disabled = false;
    document.getElementById('sourceHint').textContent = '英文小写，保存后不可修改（对应打卡数据）';
    updateEmojiState(emojis[0]);
    updateColorState(colors[0]);
    document.getElementById('modal').classList.add('show');
}

function openEdit(index) {
    editingIndex = index;
    const e = eventsList[index];
    if (!e) return;

    document.getElementById('modalTitle').textContent = '修改事件类型';
    document.getElementById('saveBtn').textContent = '保存';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('eventName').value = e.name || '';
    document.getElementById('eventSource').value = e.id || '';
    document.getElementById('eventSource').disabled = true;
    document.getElementById('sourceHint').textContent = '来源 ID 不可修改（与历史打卡数据绑定）';
    updateEmojiState(e.emoji || '📱');
    updateColorState(e.color || colors[0]);
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    editingIndex = -1;
}

function renderEmojiPicker() {
    document.getElementById('emojiPicker').innerHTML = emojis.map(e =>
        `<div class="emoji-option ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>`
    ).join('');
}

function updateEmojiState(emojiStr) {
    selectedEmoji = emojiStr || '📱';
    const input = document.getElementById('customEmojiInput');
    if (input) input.value = emojiStr;
    renderEmojiPicker();
}

function selectEmoji(e) {
    updateEmojiState(e);
}

function onCustomEmojiInputChange(val) {
    selectedEmoji = val.trim() || '📱';
    renderEmojiPicker();
}

function renderColorPicker() {
    const cur = selectedColor.toLowerCase();
    document.getElementById('colorPicker').innerHTML = colors.map(c =>
        `<div class="color-option ${c.toLowerCase() === cur ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
    ).join('');
}

function updateColorState(hex) {
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    const input = document.getElementById('hexColorInput');
    
    if (input) input.value = hex;
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

function selectColor(c) { updateColorState(c); }

function onCustomColorPickerChange(val) {
    updateColorState(val);
}

function onCustomHexInputChange(val) {
    let hex = val.trim();
    if (hex && !hex.startsWith('#')) {
        hex = '#' + hex;
    }
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

async function saveEvent() {
    const name = document.getElementById('eventName').value.trim();
    let source = document.getElementById('eventSource').value.trim().toLowerCase().replace(/\s+/g, '-');

    if (!name) {
        alert('请填写名称');
        return;
    }

    if (editingIndex < 0) {
        if (!source) {
            alert('请填写来源 ID');
            return;
        }
        if (eventsList.find(e => e.id === source)) {
            alert('该来源 ID 已存在');
            return;
        }
    }

    if (!/^#[0-9A-Fa-f]{6}$/.test(selectedColor)) {
        alert('请输入有效的 6 位 HEX 颜色值（例如：#238636）');
        return;
    }

    const targetId = editingIndex >= 0 ? eventsList[editingIndex].id : source;
    const payload = {
        id: targetId,
        name: name,
        emoji: selectedEmoji,
        color: selectedColor
    };

    try {
        const res = await fetch('/api/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('保存失败');
        await initData();
        closeModal();
    } catch (e) {
        alert('保存配置到服务器失败');
    }
}

async function confirmDelete() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;

    const ok = confirm(`确定彻底删除「${target.name}」吗？\n将同时清除该来源的全部历史打卡与热力图格子。`);
    if (!ok) return;

    try {
        const res = await fetch(`/api/sources?source=${encodeURIComponent(target.id)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('删除失败');
        await initData();
        closeModal();
    } catch (e) {
        alert('删除失败');
    }
}

function log(source) {
    if (isEditing) return;
    if (navigator.vibrate) navigator.vibrate(50);
    fetch('/api/contributions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([{
            source,
            context: 'manual',
            timestamp: new Date().toISOString(),
            metadata: { device: 'mobile', manual: true }
        }])
    }).then(r => {
        if (r.ok) toast();
    }).catch(() => alert('连接失败'));
}

function toast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

initData();
</script>
</body>
</html>
