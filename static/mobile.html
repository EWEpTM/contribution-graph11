<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <title>事件配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; color: #e6edf3; }
        .edit-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .edit-btn.active {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            align-content: start;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        .btn {
            border: none;
            border-radius: 16px;
            padding: 20px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 110px;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn .emoji { font-size: 2rem; line-height: 1; }
        .btn .name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }
        .btn .low-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.35);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 500;
            color: #e6edf3;
        }
        .add-btn {
            background: #21262d;
            border: 2px dashed #30363d;
            color: #8b949e;
        }
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            color: #8b949e;
            padding: 48px 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #e6edf3;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1rem;
            margin-bottom: 14px;
        }
        .modal input[type="text"]:focus {
            outline: none;
            border-color: #238636;
        }
        .modal input[type="text"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .modal label {
            display: block;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .hint {
            font-size: 0.75rem;
            color: #6e7681;
            margin: -8px 0 14px;
            line-height: 1.4;
        }
        .custom-emoji-row { margin-bottom: 14px; }
        .custom-emoji-row input[type="text"] {
            margin-bottom: 0;
            text-align: center;
            font-size: 1.5rem;
        }
        .color-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-option.selected { border-color: #fff; }
        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .custom-color-row input[type="color"] {
            width: 44px;
            height: 44px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            cursor: pointer;
            padding: 2px;
        }
        .custom-color-row input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            font-family: ui-monospace, monospace;
            text-transform: uppercase;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #238636;
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-row .cb-label {
            margin-bottom: 0;
            color: #e6edf3;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-buttons button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-cancel { background: #21262d; color: #8b949e; }
        .btn-save { background: #238636; color: #fff; }
        .btn-delete {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #f85149;
            border-radius: 8px;
            background: transparent;
            color: #f85149;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-delete:active { background: rgba(248,81,73,0.15); }
        .btn-delete:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger-confirm {
            background: #da3633;
            color: #fff;
        }
        .btn-danger-confirm:hover { background: #b82a28; }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 1rem;
            padding: 8px 0;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        #toast {
            visibility: hidden;
            opacity: 0;
            background: #238636;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: opacity 0.25s, visibility 0.25s;
            pointer-events: none;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
        #toast.error { background: #da3633; }
    </style>
</head>
<body>
    <div class="header">
        <h1>事件配置</h1>
        <div style="display:flex;gap:8px;">
            <button class="edit-btn" id="syncBtn" onclick="initData()" title="刷新">↻</button>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()">编辑</button>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer"><a href="/">← 返回主页</a></div>
    <div id="toast"></div>

    <!-- 新增 / 编辑弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">添加事件类型</h2>

            <label>名称</label>
            <input type="text" id="eventName" placeholder="例如：跑步" autocomplete="off">

            <label>来源 ID</label>
            <input type="text" id="eventSourceId" placeholder="例如：running" autocomplete="off">
            <div class="hint" id="sourceIdHint">用于 API / Agent 识别，建议英文小写，创建后不可修改</div>

            <label>图标（输入或粘贴 Emoji）</label>
            <div class="custom-emoji-row">
                <input type="text" id="customEmojiInput" placeholder="例如 🏃" oninput="onCustomEmojiInputChange(this.value)">
            </div>

            <label>颜色（预设 / HEX）</label>
            <div class="color-picker" id="colorPicker"></div>
            <div class="custom-color-row">
                <input type="color" id="hexColorPicker" oninput="onCustomColorPickerChange(this.value)">
                <input type="text" id="hexColorInput" placeholder="#238636" maxlength="7" oninput="onCustomHexInputChange(this.value)">
            </div>

            <div class="checkbox-row" id="lowFreqRow">
                <input type="checkbox" id="isLowFreq">
                <span class="cb-label">低频事件（1 次打卡即较亮）</span>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" id="saveBtn" onclick="saveEvent()">添加</button>
            </div>

            <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="openDeleteConfirmModal()">彻底删除此事件类型</button>
        </div>
    </div>

    <!-- 彻底删除确认弹窗 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content" style="max-width:320px;">
            <h2 style="color:#f85149;">确认彻底删除</h2>
            <p style="color:#8b949e;font-size:0.9rem;margin-bottom:16px;line-height:1.5;">
                确定要彻底删除「<strong id="deleteTargetName" style="color:#fff;"></strong>」吗？<br>
                <span style="color:#f85149;font-size:0.8rem;">⚠️ 将同步清空该事件的所有历史打卡记录！</span>
            </p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDeleteConfirmModal()">取消</button>
                <button class="btn-danger-confirm" id="confirmDeleteBtn" onclick="executeDelete()">确认删除</button>
            </div>
        </div>
    </div>

<script>
const colors = [
    '#8B4513', '#238636', '#f97316', '#eab308',
    '#3b82f6', '#a855f7', '#ec4899', '#ef4444',
    '#14b8a6', '#6366f1', '#84cc16', '#f59e0b'
];

let eventsList = [];
let isEditing = false;
let selectedEmoji = '📱';
let selectedColor = colors[0];
let editingIndex = -1;
let saving = false;

async function initData() {
    const btn = document.getElementById('syncBtn');
    if (btn) btn.style.animation = 'spin 1s linear infinite';
    try {
        const res = await fetch('/api/sources');
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (res.ok) {
            const data = await res.json();
            eventsList = Array.isArray(data) ? data : [];
        } else {
            eventsList = [];
            showToast('加载失败', true);
        }
    } catch (e) {
        eventsList = [];
        showToast('网络错误，无法加载', true);
    } finally {
        if (btn) btn.style.animation = 'none';
        render();
    }
}

function slugify(name) {
    let s = (name || '').trim().toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9\u4e00-\u9fff\-_]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    if (!s) s = 'event';
    // 若全是中文等，给一个可读前缀，避免空或纯符号
    if (!/[a-z0-9]/.test(s)) s = 'event-' + Date.now().toString(36).slice(-4);
    return s.slice(0, 48);
}

function ensureUniqueId(base) {
    const existing = new Set(eventsList.map(e => e.id));
    if (!existing.has(base)) return base;
    let i = 2;
    while (existing.has(base + '-' + i)) i++;
    return base + '-' + i;
}

function render() {
    const grid = document.getElementById('grid');

    if (!eventsList.length && !isEditing) {
        grid.innerHTML = `
            <div class="empty-tip">
                暂无事件类型<br>
                点击右上角「编辑」后新增
            </div>
        `;
        return;
    }

    grid.innerHTML = eventsList.map((e, i) => `
        <button class="btn" style="background:linear-gradient(135deg,${e.color || '#8b949e'},${adjustColor(e.color || '#8b949e', -20)})"
            onclick="openEdit(${i})">
            ${e.is_low_freq ? '<span class="low-tag">低频</span>' : ''}
            <span class="emoji">${e.emoji || '📱'}</span>
            <span class="name">${escapeHtml(e.name || e.id)}</span>
        </button>
    `).join('');

    if (isEditing) {
        grid.innerHTML += `
            <button class="btn add-btn" onclick="openAdd()">
                <span class="emoji">+</span>
                <span class="name">新增</span>
            </button>
        `;
    }
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function adjustColor(hex, percent) {
    if (!hex || !hex.startsWith('#')) return '#8b949e';
    const num = parseInt(hex.slice(1), 16);
    if (isNaN(num)) return '#8b949e';
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editBtn');
    btn.classList.toggle('active', isEditing);
    btn.textContent = isEditing ? '完成' : '编辑';
    render();
}

function openAdd() {
    editingIndex = -1;
    document.getElementById('modalTitle').textContent = '添加事件类型';
    document.getElementById('saveBtn').textContent = '添加';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('eventName').value = '';
    document.getElementById('eventSourceId').value = '';
    document.getElementById('eventSourceId').disabled = false;
    document.getElementById('sourceIdHint').textContent = '用于 API / Agent 识别，建议英文小写；可留空自动生成';
    document.getElementById('isLowFreq').checked = false;

    updateEmojiState('📱');
    updateColorState(colors[0]);
    document.getElementById('modal').classList.add('show');
    setTimeout(() => document.getElementById('eventName').focus(), 50);
}

function openEdit(index) {
    editingIndex = index;
    const e = eventsList[index];
    if (!e) return;

    document.getElementById('modalTitle').textContent = '修改事件类型';
    document.getElementById('saveBtn').textContent = '保存';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('eventName').value = e.name || '';
    document.getElementById('eventSourceId').value = e.id || '';
    document.getElementById('eventSourceId').disabled = true;
    document.getElementById('sourceIdHint').textContent = '来源 ID 创建后不可修改（与历史数据绑定）';
    document.getElementById('isLowFreq').checked = !!e.is_low_freq;

    updateEmojiState(e.emoji || '📱');
    updateColorState(e.color || colors[0]);
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    editingIndex = -1;
}

function updateEmojiState(emojiStr) {
    selectedEmoji = emojiStr || '📱';
    const input = document.getElementById('customEmojiInput');
    if (input) input.value = selectedEmoji;
}

function onCustomEmojiInputChange(val) {
    selectedEmoji = val.trim() || '📱';
}

function renderColorPicker() {
    const cur = (selectedColor || '').toLowerCase();
    document.getElementById('colorPicker').innerHTML = colors.map(c =>
        `<div class="color-option ${c.toLowerCase() === cur ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
    ).join('');
}

function updateColorState(hex) {
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    const input = document.getElementById('hexColorInput');
    if (input) input.value = hex;
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

function selectColor(c) { updateColorState(c); }

function onCustomColorPickerChange(val) {
    updateColorState(val);
}

function onCustomHexInputChange(val) {
    let hex = val.trim();
    if (hex && !hex.startsWith('#')) hex = '#' + hex;
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

// 名称失焦时，若 ID 为空则自动填 slug
document.getElementById('eventName').addEventListener('blur', () => {
    if (editingIndex >= 0) return;
    const idInput = document.getElementById('eventSourceId');
    if (idInput.value.trim()) return;
    const name = document.getElementById('eventName').value.trim();
    if (name) idInput.value = ensureUniqueId(slugify(name));
});

// 低频行点击切换（避免和 checkbox 双触发）
document.getElementById('lowFreqRow').addEventListener('click', (e) => {
    if (e.target.id === 'isLowFreq') return;
    const cb = document.getElementById('isLowFreq');
    cb.checked = !cb.checked;
});

async function saveEvent() {
    if (saving) return;

    const name = document.getElementById('eventName').value.trim();
    const isLowFreq = document.getElementById('isLowFreq').checked;
    let sourceId = document.getElementById('eventSourceId').value.trim().toLowerCase().replace(/\s+/g, '-');

    if (!name) {
        showToast('请填写名称', true);
        document.getElementById('eventName').focus();
        return;
    }

    if (editingIndex < 0) {
        if (!sourceId) sourceId = ensureUniqueId(slugify(name));
        if (!/^[a-z0-9][a-z0-9_\-]*$/i.test(sourceId) && !/^[\w\u4e00-\u9fff\-]+$/.test(sourceId)) {
            showToast('来源 ID 格式不合法', true);
            return;
        }
        // 新建时若与已有冲突，自动加后缀
        sourceId = ensureUniqueId(sourceId);
    } else {
        sourceId = eventsList[editingIndex].id;
    }

    if (!/^#[0-9A-Fa-f]{6}$/.test(selectedColor)) {
        showToast('请输入有效的 6 位 HEX 颜色', true);
        return;
    }

    const payload = {
        id: sourceId,
        name: name,
        emoji: selectedEmoji || '📱',
        color: selectedColor,
        is_low_freq: isLowFreq
    };

    saving = true;
    const saveBtn = document.getElementById('saveBtn');
    const oldText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';

    try {
        const res = await fetch('/api/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (!res.ok) {
            const err = await res.text().catch(() => '');
            throw new Error(err || '保存失败');
        }
        showToast(editingIndex >= 0 ? '已保存' : '已添加');
        await initData();
        closeModal();
    } catch (e) {
        showToast('保存失败，请重试', true);
    } finally {
        saving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = oldText;
    }
}

function openDeleteConfirmModal() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;
    document.getElementById('deleteTargetName').textContent = target.name || target.id;
    document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteConfirmModal() {
    document.getElementById('deleteModal').classList.remove('show');
}

async function executeDelete() {
    if (editingIndex < 0 || saving) return;
    const target = eventsList[editingIndex];
    if (!target) return;

    saving = true;
    const btn = document.getElementById('confirmDeleteBtn');
    btn.disabled = true;
    btn.textContent = '删除中…';

    try {
        const res = await fetch(`/api/sources?source=${encodeURIComponent(target.id)}`, {
            method: 'DELETE'
        });
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (!res.ok) throw new Error('删除失败');
        showToast('已删除');
        closeDeleteConfirmModal();
        closeModal();
        await initData();
    } catch (e) {
        showToast('删除失败', true);
    } finally {
        saving = false;
        btn.disabled = false;
        btn.textContent = '确认删除';
    }
}

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Esc 关闭弹窗
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('deleteModal').classList.contains('show')) {
        closeDeleteConfirmModal();
    } else if (document.getElementById('modal').classList.contains('show')) {
        closeModal();
    }
});

initData();
</script>
</body>
</html>
