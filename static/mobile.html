<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <title>事件列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; color: #e6edf3; }
        .edit-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .edit-btn.active {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            align-content: start;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        .btn {
            border: none;
            border-radius: 16px;
            padding: 24px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn .emoji { font-size: 2rem; }
        .add-btn {
            background: #21262d;
            border: 2px dashed #30363d;
            color: #8b949e;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #e6edf3;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1rem;
            margin-bottom: 14px;
        }
        .modal input[type="text"]:focus {
            outline: none;
            border-color: #238636;
        }
        .modal label {
            display: block;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .custom-emoji-row {
            margin-bottom: 14px;
        }
        .custom-emoji-row input[type="text"] {
            margin-bottom: 0;
            text-align: center;
            font-size: 1.5rem;
        }

        .color-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-option.selected { border-color: #fff; }

        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .custom-color-row input[type="color"] {
            width: 44px;
            height: 44px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            cursor: pointer;
            padding: 2px;
        }
        .custom-color-row input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            font-family: monospace, monospace;
            text-transform: uppercase;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #238636;
            cursor: pointer;
        }
        .checkbox-row label {
            margin-bottom: 0;
            color: #e6edf3;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel { background: #21262d; color: #8b949e; }
        .btn-save { background: #238636; color: #fff; }
        .btn-delete {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #f85149;
            border-radius: 8px;
            background: transparent;
            color: #f85149;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-delete:active { background: rgba(248,81,73,0.15); }
        .btn-danger-confirm {
            background: #da3633;
            color: #fff;
        }
        .btn-danger-confirm:hover { background: #b82a28; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 1rem;
            padding: 8px 0;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>事件列表</h1>
        <div style="display:flex;gap:8px;">
            <button class="edit-btn" id="syncBtn" onclick="initData()" title="刷新">↻</button>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()">编辑</button>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer"><a href="/">← 返回主页</a></div>

    <!-- 新增 / 编辑弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">添加事件类型</h2>

            <label>名称</label>
            <input type="text" id="eventName" placeholder="例如：跑步">

            <label>图标 (输入或粘贴 Emoji)</label>
            <div class="custom-emoji-row">
                <input type="text" id="customEmojiInput" placeholder="输入 Emoji，如 ☕" oninput="onCustomEmojiInputChange(this.value)">
            </div>

            <label>颜色 (预设 / HEX自选)</label>
            <div class="color-picker" id="colorPicker"></div>
            <div class="custom-color-row">
                <input type="color" id="hexColorPicker" oninput="onCustomColorPickerChange(this.value)">
                <input type="text" id="hexColorInput" placeholder="#238636" maxlength="7" oninput="onCustomHexInputChange(this.value)">
            </div>

            <div class="checkbox-row" onclick="document.getElementById('isLowFreq').click()">
                <input type="checkbox" id="isLowFreq" onclick="event.stopPropagation()">
                <label for="isLowFreq">少量事件（1次打卡即正常亮度）</label>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" id="saveBtn" onclick="saveEvent()">添加</button>
            </div>

            <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="openDeleteConfirmModal()">彻底删除此事件类型</button>
        </div>
    </div>

    <!-- 内置彻底删除二次确认弹窗 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content" style="max-width:320px;">
            <h2 style="color:#f85149;">确认彻底删除</h2>
            <p style="color:#8b949e;font-size:0.9rem;margin-bottom:16px;line-height:1.5;">
                确定要彻底删除「<strong id="deleteTargetName" style="color:#fff;"></strong>」吗？<br>
                <span style="color:#f85149;font-size:0.8rem;">⚠️ 将同步清空该事件的所有历史打卡记录！</span>
            </p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDeleteConfirmModal()">取消</button>
                <button class="btn-danger-confirm" onclick="executeDelete()">确认删除</button>
            </div>
        </div>
    </div>

<script>
const colors = [
    '#8B4513','#238636','#f97316','#eab308',
    '#3b82f6','#a855f7','#ec4899','#ef4444',
    '#14b8a6','#6366f1','#84cc16','#f59e0b'
];

let eventsList = [];
let isEditing = false;
let selectedEmoji = '📱';
let selectedColor = colors[0];
let editingIndex = -1;

async function initData() {
    const btn = document.getElementById('syncBtn');
    if (btn) btn.style.animation = 'spin 1s linear infinite';
    try {
        const res = await fetch('/api/sources');
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (res.ok) {
            const data = await res.json();
            eventsList = Array.isArray(data) ? data : [];
        }
    } catch (e) {
        eventsList = [];
    } finally {
        if (btn) btn.style.animation = 'none';
        render();
    }
}

function getNextAvailableSourceId() {
    const existingIds = new Set(eventsList.map(e => parseInt(e.id)).filter(n => !isNaN(n) && n > 0));
    let id = 1;
    while (existingIds.has(id)) {
        id++;
    }
    return String(id);
}

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = eventsList.map((e, i) => `
        <button class="btn" style="background:linear-gradient(135deg,${e.color},${adjustColor(e.color,-20)})"
            onclick="openEdit(${i})">
            <span class="emoji">${e.emoji || '📱'}</span>
            ${e.name}
        </button>
    `).join('');

    if (isEditing) {
        grid.innerHTML += `
            <button class="btn add-btn" onclick="openAdd()">
                <span class="emoji">+</span>
                新增
            </button>
        `;
    }
}

function adjustColor(hex, percent) {
    if (!hex || !hex.startsWith('#')) return '#8b949e';
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editBtn');
    btn.classList.toggle('active', isEditing);
    btn.textContent = isEditing ? '完成' : '编辑';
    render();
}

function openAdd() {
    editingIndex = -1;
    document.getElementById('modalTitle').textContent = '添加事件类型';
    document.getElementById('saveBtn').textContent = '添加';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('eventName').value = '';
    document.getElementById('isLowFreq').checked = false;
    
    updateEmojiState('📱');
    updateColorState(colors[0]);
    document.getElementById('modal').classList.add('show');
}

function openEdit(index) {
    editingIndex = index;
    const e = eventsList[index];
    if (!e) return;

    document.getElementById('modalTitle').textContent = '修改事件类型';
    document.getElementById('saveBtn').textContent = '保存';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('eventName').value = e.name || '';
    document.getElementById('isLowFreq').checked = !!e.is_low_freq;
    
    updateEmojiState(e.emoji || '📱');
    updateColorState(e.color || colors[0]);
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    editingIndex = -1;
}

function updateEmojiState(emojiStr) {
    selectedEmoji = emojiStr || '📱';
    const input = document.getElementById('customEmojiInput');
    if (input) input.value = emojiStr;
}

function onCustomEmojiInputChange(val) {
    selectedEmoji = val.trim() || '📱';
}

function renderColorPicker() {
    const cur = selectedColor.toLowerCase();
    document.getElementById('colorPicker').innerHTML = colors.map(c =>
        `<div class="color-option ${c.toLowerCase() === cur ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
    ).join('');
}

function updateColorState(hex) {
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    const input = document.getElementById('hexColorInput');
    
    if (input) input.value = hex;
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

function selectColor(c) { updateColorState(c); }

function onCustomColorPickerChange(val) {
    updateColorState(val);
}

function onCustomHexInputChange(val) {
    let hex = val.trim();
    if (hex && !hex.startsWith('#')) {
        hex = '#' + hex;
    }
    selectedColor = hex;
    const picker = document.getElementById('hexColorPicker');
    if (picker && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        picker.value = hex;
    }
    renderColorPicker();
}

async function saveEvent() {
    const name = document.getElementById('eventName').value.trim();
    const isLowFreq = document.getElementById('isLowFreq').checked;

    if (!name) {
        alert('请填写名称');
        return;
    }

    if (!/^#[0-9A-Fa-f]{6}$/.test(selectedColor)) {
        alert('请输入有效的 6 位 HEX 颜色值（例如：#238636）');
        return;
    }

    const targetId = editingIndex >= 0 ? eventsList[editingIndex].id : getNextAvailableSourceId();
    
    const payload = {
        id: targetId,
        name: name,
        emoji: selectedEmoji,
        color: selectedColor,
        is_low_freq: isLowFreq
    };

    try {
        const res = await fetch('/api/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (!res.ok) throw new Error('保存失败');
        await initData();
        closeModal();
    } catch (e) {
        alert('保存配置到服务器失败');
    }
}

/* ========== 内置彻底删除弹窗逻辑 ========== */
function openDeleteConfirmModal() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;

    document.getElementById('deleteTargetName').textContent = target.name;
    document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteConfirmModal() {
    document.getElementById('deleteModal').classList.remove('show');
}

async function executeDelete() {
    if (editingIndex < 0) return;
    const target = eventsList[editingIndex];
    if (!target) return;

    try {
        const res = await fetch(`/api/sources?source=${encodeURIComponent(target.id)}`, { method: 'DELETE' });
        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }
        if (!res.ok) throw new Error('删除失败');
        closeDeleteConfirmModal();
        closeModal();
        await initData();
    } catch (e) {
        alert('删除失败');
    }
}

initData();
</script>
</body>
</html>
