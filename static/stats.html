<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>年度统计 · Keep热力图</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
    // 主题初始化：与主页面同步（localStorage keep_theme），避免闪烁
    (function () {
        var p = localStorage.getItem('keep_theme') || 'system';
        var eff = p;
        if (p === 'system') {
            eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = eff;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', eff === 'dark' ? '#0d1117' : '#ffffff');
    })();
    </script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --green: #238636;
            --danger: #f85149;
            --accent: #58a6ff;
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }
        html[data-theme="light"] {
            --bg: #ffffff;
            --bg2: #f6f8fa;
            --bg3: #eaeef2;
            --text: #1f2328;
            --muted: #656d76;
            --border: #d0d7de;
            --green: #1a7f37;
            --danger: #cf222e;
            --accent: #0969da;
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 12px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .back-btn {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover { background: var(--green); color: #fff; }
        .top-title { font-size: 1.05rem; font-weight: 700; }
        .year-badge {
            margin-left: auto;
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
        }
        .stats-body {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }
        .stats-panel {
            flex: 1 1 320px;
            min-width: 280px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--card-shadow);
        }
        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .ev-row {
            margin-bottom: 14px;
        }
        .ev-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            min-width: 0;
        }
        .ev-count {
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 30px;
            text-align: left;
            flex-shrink: 0;
        }
        .ev-name {
            color: var(--text);
            word-break: break-all;
            flex: 0 1 auto;
            min-width: 0;
        }
        .ev-bar {
            flex: 1 1 44px;
            min-width: 44px;
            height: 12px;
            background: var(--bg3);
            border-radius: 6px;
            overflow: hidden;
        }
        .ev-fill {
            height: 100%;
            border-radius: 6px;
            min-width: 2px;
        }
        .empty {
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 24px 0;
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding: 18px 16px 30px;
        }
        @media (max-width: 700px) {
            .stats-panel { flex: 1 1 100%; min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <span class="top-title">年度统计</span>
        <span class="year-badge" id="yearBadge"></span>
    </div>

    <main class="stats-body">
        <section class="stats-panel" id="panelNormal">
            <h2 class="panel-title">正常事件</h2>
            <div class="ev-list" id="listNormal"></div>
        </section>
        <section class="stats-panel" id="panelLow">
            <h2 class="panel-title">低频事件</h2>
            <div class="ev-list" id="listLow"></div>
        </section>
    </main>

    <footer>统计范围：所选年份内全部打卡记录 · 柱长按第一名占比缩放</footer>

    <script>
    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    const year = new URLSearchParams(location.search).get('year') || String(new Date().getFullYear());
    document.getElementById('yearBadge').textContent = year + ' 年';

    async function loadStats() {
        let sources = [], records = [];
        try {
            const sr = await fetch('/api/sources');
            if (sr.status === 401) { window.location.href = '/login.html'; return; }
            sources = await sr.json() || [];
        } catch (_) { }
        try {
            const rr = await fetch('/api/contributions?year=' + encodeURIComponent(year));
            if (rr.status === 401) { window.location.href = '/login.html'; return; }
            records = await rr.json() || [];
        } catch (_) { }

        const bySource = {};
        records.forEach(function (c) {
            if (!c.source) return;
            bySource[c.source] = (bySource[c.source] || 0) + 1;
        });

        // 合并事件元数据（名称/emoji/颜色/低频标记），只统计有记录的事件，按次数降序排名
        const rows = sources
            .map(function (s) { return { id: s.id, name: s.name, emoji: s.emoji, color: s.color, is_low_freq: !!s.is_low_freq, count: bySource[s.id] || 0 }; })
            .filter(function (s) { return s.count > 0; })
            .sort(function (a, b) { return b.count - a.count; });

        const normal = rows.filter(function (s) { return !s.is_low_freq; });
        const low = rows.filter(function (s) { return s.is_low_freq; });
        renderList('listNormal', normal, 'normal');
        renderList('listLow', low, 'low');
    }

    function colorCss(c) {
        if (!c) return '#8b949e';
        c = String(c).trim();
        if (c.indexOf('#') === 0) return c;             // hex：#238636
        if (/^\d{1,3}(\s*,\s*\d{1,3}){2}$/.test(c)) return 'rgb(' + c + ')'; // r,g,b
        return '#8b949e';
    }

    function renderList(elId, rows) {
        const el = document.getElementById(elId);
        if (!el) return;
        if (!rows.length) {
            el.innerHTML = '<div class="empty">今年暂无记录</div>';
            return;
        }
        // 第一名光柱占满名称右侧的光柱区域，其余按次数占比缩放；颜色 = 事件设定的颜色（完全同色）
        const max = rows[0].count;
        el.innerHTML = rows.map(function (r) {
            const pct = (r.count / max * 100).toFixed(1);
            const color = colorCss(r.color);
            const nameHtml = '<span class="ev-name">' + escapeHtml(r.emoji ? r.emoji + ' ' : '') + escapeHtml(r.name) + '</span>';
            const countHtml = '<span class="ev-count">' + r.count + '</span>';
            return '<div class="ev-row">' +
                '<div class="ev-line">' + countHtml + nameHtml +
                '<div class="ev-bar"><div class="ev-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
                '</div>' +
                '</div>';
        }).join('');
    }

    loadStats();
    </script>
    <script>
    // 主题全局同步：主页面切换后本页实时跟随；系统模式跟随系统变化
    (function () {
        function applyFromStorage() {
            var p = localStorage.getItem('keep_theme') || 'system';
            var eff = p;
            if (p === 'system') {
                eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = eff;
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', eff === 'dark' ? '#0d1117' : '#ffffff');
        }
        window.addEventListener('storage', function (e) {
            if (e.key === 'keep_theme') applyFromStorage();
        });
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.addEventListener) {
            mq.addEventListener('change', function () {
                if ((localStorage.getItem('keep_theme') || 'system') === 'system') applyFromStorage();
            });
        }
    })();
    </script>
</body>
</html>
